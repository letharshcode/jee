<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Tracker - Secure Login</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0; padding: 0; background: #121212; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, sans-serif; color: #fff;
        }
        .auth-card {
            background: #1a1a1a; padding: 40px; border-radius: 12px;
            width: 100%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #2e2e2e; text-align: center;
        }
        .auth-card h2 { margin-bottom: 25px; font-size: 26px; color: #0070f3; font-weight: 700; }
        .auth-card input {
            width: 100%; padding: 12px; margin: 10px 0; background: #262626;
            border: 1px solid #3a3a3a; border-radius: 6px; color: white; box-sizing: border-box;
        }
        .auth-card button {
            width: 100%; padding: 12px; margin-top: 15px; background: #0070f3;
            color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px;
        }
        .auth-card button:hover { background: #0051cb; }
        .auth-toggle { font-size: 13px; margin-top: 20px; color: #8a8a8a; }
        .auth-toggle a { color: #0070f3; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 id="auth-title">JEE Tracker Login</h2>
        <input type="email" id="jee-email" placeholder="Enter your email">
        <input type="password" id="jee-password" placeholder="Enter password">
        <button id="auth-btn" onclick="handleAuth()">Log In</button>
        <div class="auth-toggle">
            <span id="toggle-text">First time?</span> 
            <a href="#" id="toggle-link" onclick="toggleAuthMode()">Create an account</a>
        </div>
    </div>

    <script>
        // Replace these placeholder strings with your actual keys from your Supabase Dashboard
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_ANON_KEY = "your-actual-anon-public-key";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUpMode = false;

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').innerText = isSignUpMode ? "Create Account" : "JEE Tracker Login";
            document.getElementById('auth-btn').innerText = isSignUpMode ? "Sign Up" : "Log In";
            document.getElementById('toggle-text').innerText = isSignUpMode ? "Already have an account?" : "First time?";
            document.getElementById('toggle-link').innerText = isSignUpMode ? "Log In" : "Create an account";
        }

        async function handleAuth() {
            const email = document.getElementById('jee-email').value;
            const password = document.getElementById('jee-password').value;
            if (!email || !password) return alert("Please fill in all fields.");

            if (isSignUpMode) {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) alert(error.message);
                else alert("Account created! Logging you in...");
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
            }
        }

        // The moment a user successfully logs in, send them straight to your tracker page!
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                window.location.href = "index.html"; 
            }
        });
    </script>
</body>
</html>
