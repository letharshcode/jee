<style>
:root{--bg:#070b16;--card:#0f1628d9;--bd:#222c46;--tx:#eaf0ff;--mut:#8b97b4;--ac:#5b8cff;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme]){--bg:#f3f5fb;--card:#ffffffe6;--bd:#d8deec;--tx:#0f172a;--mut:#5b6784;--ok:#059669;--bad:#e11d48;--warn:#d97706}}

.hmg{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}.hm{aspect-ratio:1;border-radius:3px;background:var(--bd);display:block}
.l1{background:color-mix(in srgb,var(--ac) 28%,var(--bd))}.l2{background:color-mix(in srgb,var(--ac) 50%,var(--bd))}.l3{background:color-mix(in srgb,var(--ac) 75%,var(--bd))}.l4{background:var(--ac)}
.card{backdrop-filter:blur(6px)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal>div{text-align:center;color:var(--mut);font-size:10px;padding:4px 0}
.cd{aspect-ratio:1;border:1px solid var(--bd);border-radius:6px;color:var(--tx);font:inherit;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1.25;min-width:0}
.cd.l0{background:var(--card)}.cd small{font-size:9px;color:inherit;opacity:.75}.cd.td{border-color:var(--ac)}.cd.sel{outline:2px solid var(--ac);outline-offset:1px}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:url(bg.jpg) center/cover no-repeat;opacity:var(--bgo,.5);pointer-events:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px 'JetBrains Mono',ui-monospace,Menlo,monospace}
.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:900}
nav{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);overflow-x:auto}
nav button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
nav button.on,.chip.on{border-color:var(--ac);color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card))}
main{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.big{font-size:clamp(56px,16vw,140px);line-height:1.05;margin:26px 0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat{text-align:right}.stat b{font-size:32px;display:block}
.play{width:50px;height:50px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}
.chip{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer;text-align:left}
.chip small{display:block;color:var(--mut);margin-top:3px}
input,select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px;font:inherit;min-width:0}
input[type=number]{width:80px}.f{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pri{background:color-mix(in srgb,var(--ac) 15%,var(--card));border-color:var(--ac);color:var(--ac)}
hr{border:0;border-top:1px solid var(--bd);margin:20px 0}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.it span{flex:1}
.done span{text-decoration:line-through;color:var(--mut)}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px}
.card b.serif{font-size:26px}.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.tblw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut);font-weight:400}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--card);border:1px solid var(--ac);color:var(--tx);padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:9;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px)}
nav button{background:none;border-color:transparent;color:var(--mut);transition:.15s}nav button:hover{color:var(--tx)}
nav button.on{background:color-mix(in srgb,var(--ac) 14%,transparent);border-color:transparent;color:var(--ac)}
.brand{font-size:18px;margin-right:6px;white-space:nowrap;align-self:center}
.btn,.chip,.play{transition:.15s}.btn:hover,.chip:hover,.play:hover{border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn,input,select{min-height:36px}input[type=checkbox],input[type=range]{min-height:0;accent-color:var(--ac)}input[type=checkbox]{width:16px;height:16px}
.card{border-radius:12px;box-shadow:0 1px 2px #0003,0 10px 28px -14px #0007}
.lbl{font-weight:600}tr:hover td{background:color-mix(in srgb,var(--ac) 5%,transparent)}
::-webkit-scrollbar{height:6px;width:6px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{nav,#toast{display:none}body::before{display:none}}
/* ---- Spotify-style theme ---- */
:root{--bg:#121212;--card:#181818e6;--bd:#2a2a2a;--tx:#fff;--mut:#b3b3b3;--ac:#1db954;--ok:#1ed760;--bad:#f15e6c;--warn:#ffa42b;--side:#000}
@media(prefers-color-scheme:light){:root:not([data-theme]){--side:#e8ebf3}}
:root[data-theme="light"]{--side:#e8ebf3}
body{font:14px/1.45 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.serif{font-family:'Inter',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
.lbl{font-size:11px;letter-spacing:.08em;font-weight:700}
main{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 20%,transparent),transparent 300px);border-radius:10px}
nav button{border-radius:999px;background:color-mix(in srgb,var(--tx) 9%,transparent);color:var(--tx);font-weight:600}
nav button:hover{background:color-mix(in srgb,var(--tx) 16%,transparent);color:var(--tx)}
nav button.on{background:var(--ac);color:#000}
.card{border-color:transparent;border-radius:8px;box-shadow:none;background:var(--card)}.card:hover{background:color-mix(in srgb,var(--tx) 8%,var(--card))}
.btn{border-radius:999px;padding:8px 18px;font-weight:700;background:color-mix(in srgb,var(--tx) 10%,transparent);border-color:transparent}
.btn:hover{background:color-mix(in srgb,var(--tx) 18%,transparent);border-color:transparent}
.btn.pri,.pri{background:var(--ac);color:#000;border-color:transparent}.btn.pri:hover{background:var(--ac);filter:brightness(1.1);transform:scale(1.03)}
.play{background:var(--ac);color:#000;border:0;width:56px;height:56px}.play:hover{transform:scale(1.07);border-color:transparent}

.chip:hover{border-color:transparent;background:color-mix(in srgb,var(--tx) 16%,transparent)}.chip.on{background:var(--ac);color:#000;border-color:transparent}.chip small{color:inherit;opacity:.7}
input,select,textarea{background:color-mix(in srgb,var(--tx) 8%,var(--card));border:1px solid transparent;border-radius:6px}
input:focus,select:focus,textarea:focus{border-color:var(--tx);outline:none}
.bar{height:4px;background:color-mix(in srgb,var(--tx) 18%,transparent)}.bar i{background:var(--ac)}
.it{border-bottom:0;border-radius:6px;padding:10px 8px}.it:hover{background:color-mix(in srgb,var(--tx) 7%,transparent)}
th{text-transform:uppercase;font-size:10px;letter-spacing:.08em;font-weight:700}
@media(min-width:900px){body{padding-left:232px}
nav{position:fixed;left:0;top:0;bottom:0;width:232px;flex-direction:column;gap:2px;padding:20px 12px;background:var(--side);border:0;overflow-y:auto;overflow-x:hidden;backdrop-filter:none}
nav button{text-align:left;width:100%;border-radius:6px;padding:11px 14px;font-size:14px;font-weight:700;background:none;color:var(--mut)}
nav button:hover{color:var(--tx);background:none}nav button.on{background:color-mix(in srgb,var(--tx) 12%,transparent);color:var(--tx)}
nav .brand{margin:0 0 18px 8px;font-size:20px}nav .lbl{margin-top:auto!important;margin-left:8px!important}main{margin-top:12px}}
</style></head><body>
<nav id="nav"></nav><main id="m"></main><div id="toast"></div>
<script>
const K='jee27',TABS=['Study clock','To Do','Quizrr Tests','Practice','Daily','Syllabus','Stats','Settings'],ACC=['#1db954','#5b8cff','#8b7cff','#f59e0b','#f43f5e'];
let S={exam:'2027-01-21',subs:['Physics','Chemistry','Mathematics','PYQs','Test','Analysis'],cur:'Mathematics',days:{},qlog:[],todos:[],tests:[],notes:{}},tab=0,run=false,last=0;
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const td=()=>new Date().toLocaleDateString('en-CA');
const day=d=>S.days[d]||(S.days[d]={s:0,sub:{}});
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const hms=s=>`${p2(Math.floor(s/3600))}:${p2(Math.floor(s%3600/60))}:${p2(s%60)}`;
const hm=s=>`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m ${s%60}s`;
const dd=d=>Math.ceil((new Date(d+'T00:00:00')-new Date(td()+'T00:00:00'))/864e5);
const dstr=o=>{const d=new Date();d.setDate(d.getDate()-o);return d.toLocaleDateString('en-CA')};
function streak(){let n=0,o=day(td()).s>=60?0:1;for(;;o++){const d=S.days[dstr(o)];if(d&&d.s>=60)n++;else break}return n}
function avg(){const k=Object.values(S.days).filter(d=>d.s>=60);return k.length?k.reduce((a,d)=>a+d.s,0)/k.length/3600:0}
function qstat(sub,from){let d=0,c=0;S.qlog.forEach(q=>{if((!sub||q.sub===sub)&&(!from||q.d>=from)){d+=q.done;c+=q.ok}});return{d,c,a:d?Math.round(c/d*100):0}}
setInterval(()=>{if(!run)return;const n=Date.now(),e=Math.floor((n-last)/1000);if(e<1)return;last+=e*1000;const d=day(td());d.s+=e;d.sub[S.cur]=(d.sub[S.cur]||0)+e;fx(e);save();tick()},500);
function tick(){const c=document.getElementById('clk');if(!c)return;const d=day(td());c.textContent=hms(d.s);document.querySelectorAll('[data-s]').forEach(e=>e.querySelector('small').textContent=hm(d.sub[e.dataset.s]||0));const g=document.getElementById('gb');if(g)g.style.width=Math.min(100,d.s/3600/(S.goal||10)*100)+'%';const a=document.getElementById('avg');if(a)a.textContent=avg().toFixed(1)}
function nav(){document.getElementById('nav').innerHTML='<span class="serif brand"><img src="favicon.png" alt="" width="28" height="28" style="border-radius:7px;vertical-align:middle;margin-right:8px">JEE<b style="color:var(--ac)">27</b></span>'+TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};go()">${t}</button>`).join('')+`<span class="lbl" style="margin-left:auto;align-self:center;white-space:nowrap">Lv ${lv()} · ${Math.round(S.xp||0)} XP</span>`}
function go(){nav();const m=document.getElementById('m');m.innerHTML=[vClock,vTodo,vTests,vPrac,vDaily,vSyl,vStats,vSettings][tab]();tick()}
function logForm(){return `<div class="f"><select id="qs">${SUBS().map(s=>`<option>${esc(s)}</option>`).join('')}</select><input id="qch" placeholder="chapter (optional)" style="width:150px"><input type="number" id="qd" placeholder="done" min="0"><input type="number" id="qc" placeholder="correct" min="0"><button class="btn pri" onclick="addQ()">add</button><button class="btn" onclick="S.qlog.pop();save();go()">undo last</button></div>`}
function addQ(){const d=+qd.value,c=+qc.value;if(!(d>0)||c<0||c>d){alert('Enter done > 0 and 0 ≤ correct ≤ done');return}S.qlog.push({d:td(),sub:qs.value,ch:qch.value.trim(),done:d,ok:c});delete S.pend;addXP(Math.round(c+(d-c)*.5),true);save();go()}
function vClock(){const n=dd(S.exam),t=qstat(null,td());
return `<div class="row"><div><div class="serif" style="font-size:30px;cursor:pointer" title="Click to change exam date" onclick="setExam()">D-${n>0?n:0}</div><div class="mut" style="font-size:10px">${S.exam} · tap to edit</div></div>
<div class="stat"><div class="lbl">Streak</div><b class="serif">${streak()} <small class="lbl">days</small></b></div></div>
<div class="big serif" id="clk">00:00:00</div><div class="bar" title="Daily goal"><i id="gb" style="background:var(--ac)"></i></div>
<div class="row" style="align-items:center"><div class="f" style="align-items:center;margin:0"><button class="play" onclick="toggle()" title="Start / pause (Space)" aria-label="Start or pause timer">${run?'❚❚':'▶'}</button><button class="x" onclick="if(confirm('Reset today?')){S.days[td()]={s:0,sub:{}};save();go()}">reset today</button></div>
<div class="stat"><div class="lbl">Avg study / day</div><b class="serif"><span id="avg">0</span> <small class="lbl">hours</small></b></div></div>
${glance()}<hr><div class="lbl">Subject</div><div class="chips">${S.subs.map(s=>`<button class="chip ${s==S.cur?'on':''}" data-s="${esc(s)}" onclick="S.cur=this.dataset.s;save();go()">${esc(s)}<small></small></button>`).join('')}</div>
<hr><div class="lbl">Questions</div>${logForm()}<div class="mut">Today: ${t.d} done · ${t.c} correct${t.d?` · ${t.a}%`:''}</div>`}
function toggle(){run=!run;last=Date.now();fs=0;fi=0;go()}
function setExam(){const v=prompt('Exam date (YYYY-MM-DD)',S.exam);if(v&&!isNaN(new Date(v))){S.exam=v;save();go()}}
function addSub(){const v=prompt('New subject name');if(v&&v.trim()&&!S.subs.includes(v.trim())){S.subs.push(v.trim());save();go()}}
let fs=0,fi=0;const MS=[[25,15],[50,30],[90,60]];
const lv=()=>Math.floor(Math.sqrt((S.xp||0)/60))+1;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3200)}
function addXP(n,q){if(n<=0)return;const a=lv();S.xp=(S.xp||0)+n;if(lv()>a)toast('⭐ Level up! You are Lv '+lv());else if(q)toast('+'+n+' XP');nav()}
function fx(e){fs+=e;S.xs=(S.xs||0)+e;while(S.xs>=60){S.xs-=60;addXP(1)}
while(fi<MS.length&&fs>=MS[fi][0]*60){toast('🔥 '+MS[fi][0]+' min focus streak! +'+MS[fi][1]+' XP');addXP(MS[fi][1]);fi++}
if(S.goal&&day(td()).s>=S.goal*3600&&S.gd!==td()){S.gd=td();addXP(50);toast('🎯 Daily goal hit! +50 XP')}}
const SUBS=()=>S.subs.filter(s=>!['Test','PYQs','Analysis'].includes(s)),PRI={H:0,M:1,L:2},KINDS={'Quizrr QPT':300,'Quizrr QFT':300};
const ML='href="https://web.getmarks.app" target="_blank" rel="noopener" onclick="S.pend=Date.now();save()"';
const tot=t=>{const a=[t.p,t.c,t.m].filter(v=>v!==''&&v!==undefined&&v!==null);return a.length?a.reduce((x,y)=>x+ +y,0):(t.tot!==undefined&&t.tot!==''?+t.tot:null)};
function normalize(){S.goal=S.goal||10;S.subs=['Physics','Chemistry','Mathematics','PYQs','Test','Analysis'];if(!S.subs.includes(S.cur))S.cur='Mathematics';S.todos.forEach(t=>{t.pri=t.pri||'M';t.sub=t.sub||'';t.ch=t.ch||'';t.due=t.due||'';if(t.rep&&t.x&&t.doneOn!==td())t.x=false});S.tests.forEach(t=>{if(t.kind===undefined){t.kind='JEE Main mock';t.p=t.p||'';t.c=t.c||'';t.m=t.m||'';if(t.sc!==''&&t.sc!==undefined)t.tot=+t.sc}});S.tests.forEach(t=>{t.name=String(t.name).replace(/^Quizrr /,'')});if(!S.qzOnly){S.tests=S.tests.filter(t=>/^Quizrr/.test(t.kind||'')||tot(t)!==null);S.qzOnly=1}save()}
function weakCh(){const m={};S.qlog.forEach(q=>{if(!q.ch)return;const k=q.sub+'|'+q.ch,o=m[k]||(m[k]={sub:q.sub,ch:q.ch,d:0,c:0});o.d+=q.done;o.c+=q.ok});return Object.values(m).filter(o=>o.d>=10).map(o=>({...o,a:Math.round(o.c/o.d*100)})).sort((a,b)=>a.a-b.a)}
function weak(){const m={};S.tests.forEach(t=>[['p','Physics'],['c','Chemistry'],['m','Mathematics']].forEach(([k,n])=>{if(t[k]!==''&&t[k]!==undefined&&t.mx)(m[n]=m[n]||[]).push(+t[k]/(t.kind=='JEE Adv mock'?120:t.kind=='Chapter test'?100:100))}));let w=null,b=9;Object.keys(m).forEach(n=>{const a=m[n].reduce((x,y)=>x+y,0)/m[n].length;if(a<b){b=a;w=n}});if(!w){let q2=101;SUBS().forEach(n=>{const q=qstat(n);if(q.d>=10&&q.a<q2){q2=q.a;w=n}})}return w}
let tf='All';
function vTodo(){const T=td(),L=S.todos.map((t,i)=>({...t,i}));
const fl=L.filter(t=>tf=='All'||(tf=='Today'&&(!t.due||t.due<=T))||(tf=='Overdue'&&t.due&&t.due<T&&!t.x)||t.sub==tf).sort((a,b)=>(a.x-b.x)||((a.due||'9')>(b.due||'9')?1:(a.due||'9')<(b.due||'9')?-1:0)||PRI[a.pri]-PRI[b.pri]);
const tt=L.filter(t=>!t.due||t.due<=T),dn=tt.filter(t=>t.x).length,rem=tt.filter(t=>!t.x).reduce((a,t)=>a+(+t.min||0),0);
return `<div class="row"><div class="lbl">To Do · ${dn}/${tt.length} done today · ${rem} min left</div><button class="btn pri" onclick="planToday()">✨ Plan today</button></div><div class="bar"><i style="width:${tt.length?dn/tt.length*100:0}%"></i></div>
<div class="f" style="margin-top:14px"><input id="ti" placeholder="Task (e.g. Solve 30 PYQs)" style="flex:1 1 220px" onkeydown="if(event.key=='Enter')addT()"><select id="ts"><option value="">General</option>${SUBS().map(s=>`<option>${esc(s)}</option>`).join('')}</select><input id="tc" placeholder="Chapter" style="width:130px"><select id="tp"><option value="H">High</option><option value="M" selected>Med</option><option value="L">Low</option></select><input type="date" id="td_" value="${T}"><input type="number" id="tm" placeholder="min"><label class="mut"><input type="checkbox" id="tr"> daily</label><button class="btn pri" onclick="addT()">add</button></div>
<div class="chips">${['All','Today','Overdue',...SUBS()].map(c=>`<button class="chip ${c==tf?'on':''}" onclick="tf=this.textContent;go()">${esc(c)}</button>`).join('')}</div>

<div class="lbl" style="margin-top:18px">Test scores vs target (${tg}%)</div>${sc.length?`<div style="position:relative;display:flex;gap:4px;align-items:flex-end;height:100px;margin:8px 0">${sc.slice(-15).map(t=>`<div title="${esc(t.name)}: ${pc(t)}%" style="flex:1;height:${Math.max(4,pc(t))}%;background:${pc(t)>=tg?'var(--ok)':'var(--ac)'};border-radius:3px"></div>`).join('')}<div style="position:absolute;left:0;right:0;bottom:${tg}%;border-top:1px dashed var(--warn)"></div></div>`:'<p class="mut">Enter test results to see your trend.</p>'}
<div class="lbl" style="margin-top:18px">Weakest chapters</div>${weakCh().slice(0,5).map(o=>`<div class="it"><span>${esc(o.sub)} · ${esc(o.ch)}</span><b class="${o.a<60?'bad':'mut'}">${o.a}%</b></div>`).join('')||'<p class="mut">Log questions with a chapter name to see them.</p>'}`}
const RAW={Physics:'Units and Dimensions:4|Motion In One Dimension:5|Motion In Two Dimensions:5|Laws of Motion:5|Work Power Energy:5|COM, Momentum & Collision:4|Rotational Motion:5|Gravitation:5|Mech. Prop. of Solids:4|Mech. Prop. of Fluids:5|Thermal Prop. of Matter:5|Thermodynamics:5|Kinetic Theory of Gases:5|Oscillations:5|Waves and Sound:5|Electrostatics:6|Capacitance:4|Current Electricity:7|Magnetic Prop. of Matter:5|Magnetic Effects of Current:6|EM Induction:6|Alternating Current:6|EM Waves:4|Ray Optics:7|Wave Optics:6|Dual Nature of Matter:4|Atomic Physics:4|Nuclear Physics:5|Semiconductors:6|*Communication System:4|Mathematics in Physics:4',
Chemistry:'Basic Concepts of Chemistry:4|Structure of Atom:5|Periodicity in Properties:5|Chemical Bonding:5|*States of Matter:5|Thermodynamics (C):6|Chemical Equilibrium:4|Ionic Equilibrium:5|Redox Reactions:4|*Hydrogen:4|*s Block Elements:3|p Block (Grp 13 & 14):5|General Organic Chemistry:6|Hydrocarbons:7|*Environmental Chemistry:4|*Solid State:5|Solutions:5|Electrochemistry:5|Chemical Kinetics:6|*Surface Chemistry:4|*Isolation of Metals:5|p Block (Grp 15–18):7|d and f Block Elements:5|Coordination Compounds:5|Haloalkanes & Haloarenes:4|Alcohols Phenols Ethers:6|Aldehydes & Ketones:5|Carboxylic Acid Derivatives:4|Amines:5|Biomolecules:5|*Polymers:3|*Chemistry in Everyday Life:4|Practical Chemistry:3',
Mathematics:'Basic of Mathematics:4|Quadratic Equation:5|Complex Number:5|Permutation Combination:7|Sequences and Series:6|Binomial Theorem:5|Trig. Ratios & Identities:5|Trigonometric Equations:4|Straight Lines:6|Circle:5|Parabola:5|Ellipse:4|Hyperbola:4|Limits:4|Functions:6|Continuity & Differentiability:5|Differentiation:4|Application of Derivatives:6|Indefinite Integration:5|Definite Integration:5|Area Under Curves:4|Differential Equations:6|Vector Algebra:5|Three Dimensional Geometry:6|Probability:6|Matrices:5|Determinants:5|Inverse Trig. Functions:5|Sets and Relations:4|*Mathematical Reasoning:4|*Heights and Distances:3|Statistics:4'};
const CHA={};Object.keys(RAW).forEach(k=>CHA[k]=RAW[k].split('|').map(x=>{const[a,b]=x.split(/:(?=\d+$)/);return{n:a.replace('*',''),t:+b,s:a[0]=='*'}}));
const chl=n=>CHA[n].filter(c=>S.xch||!c.s);
let sf='Physics';
const sk=(n,i)=>n+'|'+chl(n)[i].n,sb=(n,i)=>(S.syl&&S.syl[sk(n,i)])||0,qb=(n,i,q)=>(S.sq&&S.sq[sk(n,i)+'#'+q])||0,bits=v=>(v&1)+(v>>1&1)+(v>>2&1);
let so={};
function sy(n,i,b){S.syl=S.syl||{};const k=sk(n,i),v=S.syl[k]||0;S.syl[k]=v^b;if(!(v&b))addXP(20,true);save();go()}
function sq(n,i,q,b){S.sq=S.sq||{};const k=sk(n,i)+'#'+q,v=S.sq[k]||0;S.sq[k]=v^b;if(!(v&b))addXP(b==4?5:10,true);save();go()}
function cpr(n,i){const c=chl(n)[i];let d=sb(n,i)&1;for(let q=1;q<=c.t;q++)d+=bits(qb(n,i,q));return[d,1+3*c.t]}
function synfo(n){const L=chl(n),fin=(S.fin&&S.fin[n])||new Date(new Date(S.exam+'T00:00:00')-30*864e5).toLocaleDateString('en-CA'),left=L.filter((_,i)=>!(sb(n,i)&1)).length,days=Math.max(1,dd(fin)),per=left/days;let d=0,m=0;L.forEach((_,i)=>{const r=cpr(n,i);d+=r[0];m+=r[1]});return{L,fin,left,days,per,pr:Math.round(d/m*100)}}
function setFin(n,v){if(!v)return;S.fin=S.fin||{};S.fin[n]=v;save();go()}
function planSyl(n){const o=synfo(n),c=Math.max(1,Math.ceil(o.per)),T=td();let a=0;o.L.forEach((ch,i)=>{if(a<c&&!(sb(n,i)&1)){const t='Study chapter: '+ch.n;if(!S.todos.some(x=>x.t==t&&x.due==T)){S.todos.push({t,sub:n,ch:ch.n,pri:'H',due:T,min:90,x:false});a++}}});save();toast(a?'Added '+a+' chapter(s) to To Do':'Already in To Do')}
function vSyl(){const A=Object.keys(CHA),tp=A.reduce((a,n)=>a+synfo(n).pr,0)/3,o=synfo(sf),CB=(f,l)=>`<label class="mut" style="white-space:nowrap"><input type="checkbox" ${f[0]?'checked':''} onchange="${f[1]}"> ${l}</label>`;
return `<div class="row"><div class="lbl">JEE Main syllabus · MathonGo/Quizrr 2027 · overall ${Math.round(tp)}%</div><label class="mut"><input type="checkbox" ${S.xch?'checked':''} onchange="S.xch=this.checked;save();go()"> include beyond-JEE-Main chapters</label></div>
<div class="grid" style="margin:12px 0">${A.map(n=>{const x=synfo(n);return `<div class="card" onclick="sf='${n}';go()" style="cursor:pointer;${n==sf?'border-color:var(--ac)':''}"><div class="lbl">${n}</div><b class="serif">${x.pr}%</b><div class="mut">${x.L.length-x.left}/${x.L.length} theory done</div><div class="bar"><i style="width:${x.pr}%"></i></div></div>`}).join('')}</div>
<div class="card"><div class="row" style="align-items:center"><b class="serif" style="font-size:20px">${sf}</b><label class="mut">finish theory by <input type="date" value="${o.fin}" onchange="setFin('${sf}',this.value)"></label></div>
<p style="margin:10px 0">${o.left?`<b>${o.per.toFixed(2)}</b> chapters/day needed · ${o.left} left · ${o.days} days to go`:'<span class="ok">Theory complete ✓ — keep attempting QCTs</span>'}</p>
${o.left?`<button class="btn pri" onclick="planSyl('${sf}')">+ Add today's target to To Do</button>`:''}</div>
<div class="lbl" style="margin-top:16px">${o.L.length} chapters · ${o.L.reduce((a,c)=>a+c.t,0)} QCTs · tap a chapter to open · Theory +20 XP · Attempted / Analysis +10 · Revise +5</div>
${o.L.map((c,i)=>{const r=cpr(sf,i),qs=[];for(let q=1;q<=c.t;q++){const b=qb(sf,i,q);qs.push(`<div class="f" style="margin:4px 0;align-items:center"><span class="mut" style="width:56px">QCT ${q}</span>${[['Attempted',1],['Analysis',2],['Revise',4]].map(([l,m])=>CB([b&m,`sq('${sf}',${i},${q},${m})`],l)).join('')}</div>`)}
return `<details class="it" style="display:block" ${so[sf+i]?'open':''} ontoggle="so['${sf}${i}']=this.open"><summary style="cursor:pointer;display:flex;gap:10px;align-items:center"><span style="flex:1"><span class="mut">${i+1}.</span> ${esc(c.n)}<br><small class="mut">${c.t} QCTs${c.s?' · beyond JEE Main':''}</small></span><small class="${r[0]==r[1]?'ok':'mut'}">${r[0]}/${r[1]}</small></summary><div class="f" style="margin:8px 0">${CB([sb(sf,i)&1,`sy('${sf}',${i},1)`],'Theory')}</div>${qs.join('')}</details>`}).join('')}`}
function glance(){const T=td(),tt=S.todos.filter(t=>!t.due||t.due<=T),dn=tt.filter(t=>t.x).length,nx=S.tests.filter(t=>t.date>=T&&!t.at).sort((a,b)=>a.date<b.date?-1:1)[0],A=Object.keys(CHA),sp=Math.round(A.reduce((a,n)=>a+synfo(n).pr,0)/A.length),C=(l,v,n)=>`<div class="card"><div class="lbl">${l}</div><b class="serif" style="font-size:22px">${v}</b>${n?`<div class="mut">${n}</div>`:''}</div>`;
return `<div class="grid" style="margin-top:20px">${C('To Do today',dn+'/'+tt.length,tt.length-dn?tt.length-dn+' remaining':'all done')}${C('Next test',nx?esc(nx.name):'—',nx?(dd(nx.date)>0?'in '+dd(nx.date)+' days':dd(nx.date)==0?'today':Math.abs(dd(nx.date))+' days ago')+' · '+nx.date:'')}${C('Syllabus',sp+'%','theory + QCT progress')}</div>`}
document.addEventListener('keydown',e=>{if(e.code=='Space'&&tab==0&&!/INPUT|TEXTAREA|SELECT|BUTTON|A/.test(e.target.tagName)){e.preventDefault();toggle()}});
let ld=td();setInterval(()=>{if(td()!==ld){ld=td();normalize();go()}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.pend&&Date.now()-S.pend<216e5&&tab!=3){tab=3;go()}});
normalize();apply();if(!S.tests.length)loadQuizrr();go();
</script></body></html>
