<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>JEE 27 · Command Center</title>
<meta name="description" content="A professional JEE Main 2027 study command center with timer, tasks, tests, practice, syllabus, calendar and analytics.">
<style>
:root{
  --bg:#0b0d10; --sidebar:#111317; --panel:#171a1f; --panel-2:#1c2026;
  --line:#2a3038; --text:#f5f7fa; --muted:#9aa4b2; --faint:#697381;
  --accent:#7c87ff; --accent-2:#6975f7; --success:#38d39f; --warning:#ffb454; --danger:#ff6e87;
  --shadow:0 16px 40px rgba(0,0,0,.22),0 2px 10px rgba(0,0,0,.18);
  --radius:18px; --radius-sm:12px;
}
:root[data-theme="light"]{
  --bg:#f5f7fb; --sidebar:#ffffff; --panel:#ffffff; --panel-2:#f0f3f8;
  --line:#dfe4ec; --text:#161a22; --muted:#687385; --faint:#8993a3;
  --shadow:0 14px 32px rgba(26,34,52,.08),0 2px 8px rgba(26,34,52,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{outline:none}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
::-webkit-scrollbar-track{background:transparent}

/* App shell */
#app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:240px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;z-index:50}
.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 20px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.brand-mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#8e79ff,#5e6cf2);box-shadow:0 8px 20px rgba(104,110,255,.25)}
.brand-mark svg{width:23px;height:23px}
.brand-copy{font-weight:800;letter-spacing:-.03em;font-size:17px}
.brand-copy small{display:block;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.02em;margin-top:1px}
.nav-group{margin-top:18px}
.nav-label{padding:0 11px 8px;color:var(--faint);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.nav-item{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:12px;margin:2px 0;text-align:left;transition:.18s ease}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.95}
.nav-item span{flex:1}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:color-mix(in srgb,var(--accent) 15%,var(--panel));color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nav-item.active svg{color:var(--accent)}
.side-bottom{margin-top:auto}
.profile-mini{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:14px;cursor:pointer;transition:.18s}
.profile-mini:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#26304a,#1f2430);color:#fff;font-weight:800;font-size:13px;border:1px solid var(--line)}
.profile-mini .meta{min-width:0;flex:1}.profile-mini b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-mini small{color:var(--muted);font-size:11px}
.main{margin-left:240px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;min-height:78px;padding:14px 34px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px)}
.topbar-left{min-width:0;flex:1}.eyebrow{color:var(--muted);font-size:12px;margin-bottom:2px}.page-title{font-size:22px;font-weight:800;letter-spacing:-.035em}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn,.ghost-btn,.primary-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);height:38px;padding:0 13px;border-radius:11px;display:inline-flex;align-items:center;gap:8px;transition:.18s ease}
.icon-btn{width:38px;padding:0;justify-content:center}.icon-btn svg{width:18px;height:18px}
.ghost-btn:hover,.icon-btn:hover{background:var(--panel-2);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.primary-btn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:750;box-shadow:0 8px 20px rgba(124,135,255,.2)}
.primary-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.mobile-menu{display:none}
.content{max-width:1500px;margin:0 auto;padding:30px 34px 60px}

/* generic */
.section{margin-top:28px}.section:first-child{margin-top:0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}.section-head h2{font-size:18px;margin:0;font-weight:800;letter-spacing:-.03em}.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.grid{display:grid;gap:16px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}.card-hover{transition:.18s}.card-hover:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 24%,var(--line))}
.muted{color:var(--muted)}.faint{color:var(--faint)}.success{color:var(--success)}.warning{color:var(--warning)}.danger{color:var(--danger)}
.kicker{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.big-num{font-size:34px;font-weight:850;letter-spacing:-.045em;line-height:1}
.small{font-size:12px}.tiny{font-size:10px}
.hr{height:1px;background:var(--line);border:0;margin:20px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:10px}

/* home */
.hero{position:relative;overflow:hidden;padding:26px 28px;background:radial-gradient(70% 120% at 0% 0%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 62%),var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.hero-grid{display:grid;grid-template-columns:1.35fr .8fr;gap:24px;align-items:stretch}
.hero h1{margin:7px 0 7px;font-size:35px;line-height:1.12;letter-spacing:-.045em}.hero p{margin:0;color:var(--muted);max-width:670px}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.pill{padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--text) 5%,transparent);color:var(--muted);font-size:11px}.pill strong{color:var(--text)}
.hero-count{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;border-left:1px solid var(--line);padding-left:26px}.count-row{display:flex;align-items:baseline;gap:7px}.count-num{font-size:62px;font-weight:900;letter-spacing:-.07em;line-height:.9}.count-unit{font-size:14px;color:var(--muted);font-weight:700}.count-label{margin-top:10px;color:var(--muted);font-size:12px}.count-bar{height:7px;border-radius:999px;background:var(--line);width:100%;margin-top:15px;overflow:hidden}.count-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px}
.focus-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.timer-card{padding:22px;min-height:265px;position:relative;overflow:hidden}.timer-top{display:flex;align-items:center;justify-content:space-between;gap:15px}.subject-select{min-width:170px}
.timer-body{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin-top:18px}.ring{width:156px;height:156px;border-radius:50%;background:conic-gradient(var(--accent) 0deg,var(--accent) 0deg,var(--line) 0deg);display:grid;place-items:center;position:relative}.ring:after{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--panel)}.ring-inner{position:relative;z-index:1;text-align:center}.ring-time{font-size:25px;font-weight:850;letter-spacing:-.035em;font-variant-numeric:tabular-nums}.ring small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.timer-copy h3{margin:0 0 5px;font-size:16px}.timer-copy p{margin:0;color:var(--muted);font-size:12px;max-width:350px}.timer-actions{display:flex;gap:10px;margin-top:17px;align-items:center}.play-btn{width:50px;height:50px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;box-shadow:0 10px 24px rgba(124,135,255,.24)}.play-btn svg{width:19px;height:19px;fill:currentColor}.text-btn{border:0;background:transparent;color:var(--muted);font-size:12px}.text-btn:hover{color:var(--text)}
.goal-card{padding:22px;min-height:265px}.goal-top{display:flex;justify-content:space-between;align-items:flex-start}.goal-value{font-size:34px;font-weight:850;letter-spacing:-.05em}.goal-value span{font-size:14px;color:var(--muted);font-weight:700}.goal-progress{height:9px;border-radius:999px;background:var(--line);overflow:hidden;margin:16px 0 11px}.goal-progress i{height:100%;display:block;background:linear-gradient(90deg,var(--accent),#9e7fff);border-radius:999px}
.goal-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.goal-meta .stat{padding:12px;border-radius:13px;background:var(--panel-2)}.goal-meta b{display:block;font-size:17px}.goal-meta small{color:var(--muted);font-size:10px}
.quick-stat{padding:18px 19px}.quick-stat .topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.quick-stat .icon-box{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}.quick-stat .icon-box svg{width:18px;height:18px}.quick-stat .num{font-size:28px;font-weight:850;letter-spacing:-.045em;margin-top:15px}.quick-stat .desc{color:var(--muted);font-size:11px;margin-top:3px}.progress-mini{height:4px;background:var(--line);border-radius:999px;margin-top:13px;overflow:hidden}.progress-mini i{display:block;height:100%;border-radius:999px;background:var(--accent)}

.schedule-card{padding:20px}.schedule-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.schedule-item:first-child{border-top:0;padding-top:4px}.date-box{width:45px;height:45px;border-radius:12px;background:var(--panel-2);display:flex;flex-direction:column;justify-content:center;align-items:center;flex:none}.date-box b{font-size:16px;line-height:1}.date-box small{font-size:9px;color:var(--muted);margin-top:2px}.schedule-main{min-width:0;flex:1}.schedule-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.schedule-main small{display:block;color:var(--muted);margin-top:2px}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}.status-dot.upcoming{background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 12%,transparent)}.status-dot.done{background:var(--success)}

.heatmap{padding:20px}.heat-grid{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(10px,1fr);gap:4px;overflow-x:auto;padding:7px 2px 4px}.heat-cell{aspect-ratio:1;border-radius:4px;background:var(--line);min-width:11px}.heat-1{background:color-mix(in srgb,var(--accent) 25%,var(--line))}.heat-2{background:color-mix(in srgb,var(--accent) 45%,var(--line))}.heat-3{background:color-mix(in srgb,var(--accent) 68%,var(--line))}.heat-4{background:var(--accent)}.heat-legend{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10px;margin-top:10px}.heat-legend i{width:12px;height:12px;border-radius:3px;background:var(--line)}

.chart-card{padding:20px}.chart{height:185px;display:flex;align-items:flex-end;gap:7px;padding:16px 6px 0}.chart-col{height:100%;flex:1;display:flex;align-items:flex-end;min-width:0}.chart-bar{width:100%;height:10%;border-radius:7px 7px 3px 3px;background:var(--accent);opacity:.45;transition:.2s;position:relative}.chart-col:last-child .chart-bar{opacity:1}.chart-bar:hover{filter:brightness(1.1)}.chart-labels{display:flex;gap:7px;padding:6px 6px 0}.chart-labels span{flex:1;text-align:center;color:var(--faint);font-size:9px;white-space:nowrap}

/* task/test/practice */
.page-panel{padding:22px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filter-chip{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);padding:9px 12px;border-radius:999px;font-weight:700;font-size:11px}.filter-chip.active{background:var(--accent);border-color:var(--accent);color:white}.form-grid{display:grid;grid-template-columns:2fr 1fr 1fr 110px 100px auto;gap:8px}.input,.select,.textarea{width:100%;height:40px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:0 12px}.textarea{height:auto;padding:10px 12px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent)}
.task-row{display:grid;grid-template-columns:22px 1fr auto auto 30px;gap:11px;align-items:center;padding:13px 4px;border-top:1px solid var(--line)}.task-row:first-child{border-top:0}.task-check{width:18px;height:18px;accent-color:var(--accent)}.task-title{font-weight:700}.task-row.done .task-title{text-decoration:line-through;color:var(--faint)}.task-sub{font-size:10px;color:var(--muted);margin-top:2px}.priority{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px;background:var(--panel-2)}.priority.high{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}.priority.med{color:var(--warning);background:color-mix(in srgb,var(--warning) 11%,transparent)}.delete{border:0;background:transparent;color:var(--faint)}.delete:hover{color:var(--danger)}
.test-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric-box{padding:16px;border-radius:14px;background:var(--panel-2)}.metric-box b{font-size:23px;display:block;margin-top:8px}.metric-box small{color:var(--muted);font-size:10px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:12px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}tr:last-child td{border-bottom:0}tbody tr:hover{background:color-mix(in srgb,var(--text) 3%,transparent)}
.table-status{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;background:var(--panel-2)}
.practice-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.practice-card{padding:18px}.subject-progress{display:flex;align-items:center;justify-content:space-between;margin:9px 0 7px}.line-progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden}.line-progress i{display:block;height:100%;background:var(--accent);border-radius:999px}.weak-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.weak-row:first-child{border-top:0}.weak-row span:first-child{min-width:0;flex:1}.weak-row b{font-size:12px}

/* syllabus */
.subject-tabs{display:flex;gap:8px;overflow:auto}.subject-tab{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);padding:9px 14px;border-radius:999px;font-weight:800;font-size:11px;white-space:nowrap}.subject-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}.syl-overview{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.syl-card{padding:17px}.chapter-row{border-top:1px solid var(--line);padding:14px 0}.chapter-row:first-child{border-top:0}.chapter-main{display:flex;align-items:center;gap:10px}.chapter-name{font-weight:750}.chapter-meta{font-size:10px;color:var(--muted);margin-top:2px}.chapter-progress{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.check-pill{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}.check-pill input{accent-color:var(--accent)}.chapter-right{margin-left:auto;color:var(--muted);font-size:11px}.chapter-row details summary{list-style:none;cursor:pointer}.chapter-row details summary::-webkit-details-marker{display:none}

/* calendar + analytics */
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.month-title{font-size:18px;font-weight:850}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekday{padding:4px 6px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.day-cell{min-height:105px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);padding:9px;cursor:pointer;transition:.15s;position:relative}.day-cell:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}.day-cell.muted-day{opacity:.45}.day-cell.today{box-shadow:inset 0 0 0 1px var(--accent)}.day-cell.selected{outline:2px solid var(--accent);outline-offset:1px}.day-num{font-size:11px;font-weight:850}.day-hours{font-size:10px;color:var(--muted);margin-top:7px}.day-meter{height:5px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:7px}.day-meter i{display:block;height:100%;background:var(--accent);border-radius:999px}.day-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.tag{font-size:8px;padding:3px 5px;border-radius:999px;background:color-mix(in srgb,var(--accent) 11%,transparent);color:var(--muted);border:1px solid color-mix(in srgb,var(--accent) 15%,var(--line))}.selected-day{padding:18px}.analytics-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.analytics-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bar-list{display:flex;flex-direction:column;gap:11px}.bar-line{display:grid;grid-template-columns:120px 1fr 42px;gap:10px;align-items:center}.bar-line .name{color:var(--muted);font-size:11px}.bar-line .track{height:8px;background:var(--line);border-radius:999px;overflow:hidden}.bar-line .track i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* settings/onboarding */
.settings-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.setting-row:first-child{border-top:0}.setting-row label{font-weight:750}.setting-row p{margin:2px 0 0;color:var(--muted);font-size:11px}.toggle{width:44px;height:24px;border-radius:999px;border:0;background:var(--line);padding:3px}.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s}.toggle.on{background:var(--accent)}.toggle.on i{transform:translateX(20px)}.color-dots{display:flex;gap:7px}.color-dot{width:24px;height:24px;border-radius:50%;border:2px solid transparent}.color-dot.active{border-color:var(--text);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}

.onboarding{position:fixed;inset:0;z-index:100;background:radial-gradient(60% 70% at 50% 0%,rgba(124,135,255,.15),transparent 65%),var(--bg);display:grid;place-items:center;padding:30px}.onboard-shell{width:min(1100px,100%);display:grid;grid-template-columns:1.05fr .95fr;gap:0;min-height:620px;background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.45);overflow:hidden}.onboard-left{padding:44px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);background:radial-gradient(80% 80% at 0% 0%,rgba(124,135,255,.12),transparent 65%)}.onboard-logo{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;margin-bottom:26px}.onboard-left h1{font-size:50px;line-height:1.02;letter-spacing:-.055em;margin:0 0 14px}.onboard-left p{color:var(--muted);font-size:15px;max-width:520px}.feature-list{display:grid;gap:10px;margin-top:24px}.feature{display:flex;align-items:center;gap:10px;color:#e8ebf0;font-size:12px}.feature span{width:24px;height:24px;display:grid;place-items:center;border-radius:7px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}.onboard-right{padding:44px;display:flex;flex-direction:column;justify-content:center}.step-dots{display:flex;gap:7px;margin-bottom:28px}.step-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.step-dots i.active{width:24px;border-radius:999px;background:var(--accent)}.onboard-right h2{margin:0;font-size:25px;letter-spacing:-.035em}.onboard-right .sub{color:var(--muted);font-size:12px;margin:5px 0 20px}.setup-form{display:grid;gap:12px}.setup-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.setup-input{height:46px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{padding:11px 10px;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;color:var(--muted);font-weight:750;font-size:11px}. function pc(t){const v=tot(t);return v!==null&&t.mx?Math.round(v/t.mx*100):null}

 <div class="section"><div class="focus-grid"><div class="card timer-card"><div class="timer-top"><div><div class="kicker">Focus room</div><h2 style="margin:4px 0 0;font-size:20px">${timerRunText()}</h2></div><select class="select subject-select" onchange="S.cur=this.value;save();renderPage()">${SUBS().map(s=>`<option ${S.cur===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="timer-body"><div class="ring" id="ring"><div class="ring-inner"><div class="ring-time" id="clk">${hms(studied)}</div><small>today · ${esc(S.cur)}</small></div></div><div class="timer-copy"><h3>${timerRun?'Timer is running':'Ready when you are.'}</h3><p>${timerRun?'Keep the phone away and stay with one task.':'Press start to track time against your daily goal. The timer keeps subject-level totals automatically.'}</p><div class="timer-actions"><button class="play-btn" onclick="toggleTimer()">${icon(timerRun?'pause':'play')}</button><button class="text-btn" onclick="resetToday()">Reset today</button><button class="ghost-btn" style="height:34px;padding:0 11px" onclick="addFocusXp()">+ focus bonus</button></div></div></div></div>

function metricCard(label,val,sub,ic,extra){const p=label==='Study today'?Math.min(100,day(today()).s/(S.goal*3600)*100):label==='Questions today'?(qstat(null,today()).d?Math.min(100,qstat(null,today()).a):0):label==='Syllabus'?Number(sub.replace(/[^0-9.]/g,''))||0:Math.min(100,testAverage());return `<div class="card quick-stat card-hover"><div class="topline"><div class="kicker">${label}</div><div class="icon-box">${icon(ic)}</div></div><div class="num">${val}</div><div class="desc">${extra}</div><div class="progress-mini"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div></div>`}

function resetToday(){if(confirm('Reset today’s study time?')){S.days[today()]={s:0,sub:{}};save();renderPage();toast('Today reset')}}
function addFocusXp(){addXP(15,true);toast('Focus bonus added')}
function tickUI(){if(timerRun){const now=Date.now(),e=Math.floor((now-lastTick)/1000);if(e>0){lastTick+=e*1000;const d=day(today());d.s+=e;d.sub[S.cur]=(d.sub[S.cur]||0)+e;focusSec+=e;S.xs=(S.xs||0)+e;if(S.xs>=60){const mins=Math.floor(S.xs/60);S.xs%=60;addXP(mins,false)}for(;focusIdx<focusMilestones.length&&focusSec>=focusMilestones[focusIdx][0]*60;focusIdx++){toast('Focus milestone · +'+focusMilestones[focusIdx][1]+' XP');addXP(focusMilestones[focusIdx][1],false)}save()}}const clk=$('clk');if(clk)clk.textContent=hms(day(today()).s);const ring=$('ring');if(ring){const pct=Math.min(100,day(today()).s/(S.goal*3600)*100);ring.style.background=`conic-gradient(var(--accent) ${pct*3.6}deg,var(--line) ${pct*3.6}deg)`}const bar=$('homeGoalProgress');if(bar)bar.style.width=Math.min(100,day(today()).s/(S.goal*3600)*100)+'%';lastTick=Date.now()}
setInterval(()=>{if(timerRun){tickUI();if(S.ui.tab==='home'){const c=$('clk');if(c)c.textContent=hms(day(today()).s);const ring=$('ring');if(ring){const pct=Math.min(100,day(today()).s/(S.goal*3600)*100);ring.style.background=`conic-gradient(var(--accent) ${pct*3.6}deg,var(--line) ${pct*3.6}deg)`}}}},1000);
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA|SELECT|BUTTON|A/.test(e.target.tagName)&&S.ui.tab==='timer'){e.preventDefault();toggleTimer()}});
function subjectBars(){const all=SUBS().map(s=>[s,dayTotals(s)]).filter(x=>x[1]>0);const total=all.reduce((a,x)=>a+x[1],0)||1;return all.slice(0,4).map(([s,v])=>`<div class="bar-line" style="grid-template-columns:90px 1fr 45px"><span class="name">${esc(s)}</span><span class="track"><i style="width:${v/total*100}%"></i></span><b style="font-size:10px">${(v/3600).toFixed(1)}h</b></div>`).join('')||'<div class="muted small">Start the timer to build your subject mix.</div>'}
function dayTotals(sub){return Object.values(S.days||{}).reduce((a,d)=>a+(d.sub?.[sub]||0),0)}
function heatmapHTML(){const cells=[];for(let i=364;i>=0;i--){const h=(S.days[dstr(i)]?.s||0)/3600;let cls='';if(h>0&&h<S.goal*.25)cls=' heat-1';else if(h<S.goal*.5&&h>0)cls=' heat-2';else if(h<S.goal&&h>0)cls=' heat-3';else if(h>=S.goal)cls=' heat-4';cells.push(`<i class="heat-cell${cls}" title="${dstr(i)} · ${h.toFixed(1)}h"></i>`)}return `<div class="heat-grid">${cells.join('')}</div>`}
function weeklyHours(){const a=[];for(let w=7;w>=0;w--){let total=0;for(let i=w*7;i<w*7+7;i++)total+=(S.days[dstr(i)]?.s||0);a.push(total/3600)}return a}
function weeklyChart(){const a=weeklyHours(),mx=Math.max(1,...a,S.goal*7);return `<div class="chart">${a.map((h,i)=>`<div class="chart-col" title="Week ${i+1}: ${h.toFixed(1)}h"><div class="chart-bar" style="height:${Math.max(8,h/mx*100)}%"></div></div>`).join('')}</div><div class="chart-labels">${a.map((_,i)=>`<span>W${i+1}</span>`).join('')}</div>`}
function scoreTrend(){const sc=S.tests.map(t=>({t,v:pc(t)})).filter(x=>x.v!==null).slice(-10);if(!sc.length)return '<div class="muted small" style="padding:45px 0;text-align:center">Enter test results to see your score trend.</div>';return `<div class="chart">${sc.map((x,i)=>`<div class="chart-col" title="${esc(x.t.name)} · ${x.v}%"><div class="chart-bar" style="height:${Math.max(9,x.v)}%;opacity:${i===sc.length-1?1:.45}"></div></div>`).join('')}</div><div class="chart-labels">${sc.map(x=>`<span>${esc(x.t.name.replace(/Quizrr /,'').slice(0,7))}</span>`).join('')}</div>`}

function tasksView(){const T=today();let list=S.todos.map((t,i)=>({...t,i}));list=list.filter(t=>taskFilter==='All'||(taskFilter==='Today'&&(!t.due||t.due<=T))||(taskFilter==='Overdue'&&t.due&&t.due<T&&!t.x)||t.sub===taskFilter).sort((a,b)=>(a.x-b.x)||String(a.due||'9').localeCompare(String(b.due||'9')));const todayTasks=S.todos.filter(t=>!t.due||t.due<=T),done=todayTasks.filter(t=>t.x).length,remaining=todayTasks.filter(t=>!t.x).reduce((a,t)=>a+(Number(t.min)||0),0);return `<div class="section"><div class="card page-panel"><div class="section-head"><div><h2>Today’s workload</h2><p>${done}/${todayTasks.length} tasks complete · ${remaining} minutes estimated remaining</p></div><button class="primary-btn" onclick="planToday()">${icon('plus')} Plan today</button></div><div class="goal-progress"><i style="width:${todayTasks.length?done/todayTasks.length*100:0}%"></i></div><div class="filters">${['All','Today','Overdue',...SUBS()].map(x=>`<button class="filter-chip ${taskFilter===x?'active':''}" onclick="taskFilter='${esc(x)}';renderPage()">${esc(x)}</button>`).join('')}</div><div class="form-grid"><input class="input" id="task_text" placeholder="Task, e.g. Solve 30 PYQs"><select class="select" id="task_sub"><option value="">General</option>${SUBS().map(s=>`<option>${esc(s)}</option>`).join('')}</select><input class="input" id="task_ch" placeholder="Chapter"><select class="select" id="task_pri"><option value="H">High</option><option value="M" selected>Medium</option><option value="L">Low</option></select><input class="input" id="task_min" type="number" min="0" placeholder="min"><button class="primary-btn" onclick="addTask()">${icon('plus')}Add</button></div><div style="margin-top:18px">${list.map(taskRow).join('')||'<div class="muted small" style="padding:18px 4px">Nothing here yet. Use “Plan today” to generate a realistic study list from your tests and weak areas.</div>'}</div>${S.todos.some(t=>t.x&&!t.rep)?'<div class="hr"></div><button class="ghost-btn" onclick="clear function enterResult(i){const v=prompt('Marks as Physics, Chemistry, Maths. Example: 62, 48, 71','');if(v===null)return;const a=v.split(',').map(x=>x.trim()===''?'':Number(x));if(a.some(x=>x!==''&&!Number.isFinite(x))){toast('Use numbers separated by commas');return}Object.assign(S.tests[i],{p:a[0]??'',c:a[1]??'',m:a[2]??''});save();renderPage();toast('Result saved')}
function toggleTest(i,k,v){S.tests[i][k]=v;save();}
function testAverage(){const s=S.tests.filter(t=>tot(t)!==null&&t.mx);return s.length?Math.round(s.reduce((a,t)=>a+pc(t),0)/s.length):0}

function practiceView(){const all=qstat(), w=weakCh().slice(0,7);return `<div class="section"><div class="card page-panel"><div class="row wrap"><div><div class="kicker">Practice hub</div><h2 style="margin:5px 0">Practice on MARKS, then bring the data back here.</h2><p class="muted small">Log question sessions by subject and chapter so the dashboard can surface weak spots.</p></div><a class="primary-btn" href="https://web.getmarks.app" target="_blank" rel="noopener" onclick="S.pend=Date.now();save()">Open MARKS ${icon('arrow')}</a></div><div class="hr"></div>${qLogForm()}</div></div><div class="section"><div class="practice-grid">${SUBS().map(s=>{const q=qstat(s),raw=q.d?Math.round(q.c/q.d*100):0;return `<div class="card practice-card"><div class="kicker">${esc(s)}</div><div class="big-num" style="font-size:28px">${raw}%</div><div class="muted small">${q.c}/${q.d} correct</div><div class="subject-progress"><span class="muted tiny">question accuracy</span><b class="tiny">${q.d?raw+'%':'—'}</b></div><div class="line-progress"><i style="width:${raw}%"></i></div><div class="row" style="margin-top:14px"><a class="ghost-btn" style="height:33px;padding:0 10px" href="https://web.getmarks.app" target="_blank" rel="noopener">MARKS ↗</a><button class="ghost-btn" style="height:33px;padding:0 10px" onclick="S.cur='${esc(s)}';openPage('timer')">Track time</button></div></div>`}).join('')}</div></div><div class="section"><div class="card page-panel"><div class="section-head"><div><h2>Weakest chapters</h2><p>Only chapters with 10+ logged attempts are shown.</p></div><button class="ghost-btn" onclick="planToday()">Build drill</button></div>${w.map((o,i)=>`<div class="weak-row"><span><b style="display:block">${esc(o.ch)}</b><small class="muted">${esc(o.sub)} · ${o.d} attempts</small></span><b class="${o.a<60?'danger':'warning'}">${o.a}%</b><button class="ghost-btn" style="height:32px;padding:0 10px" onclick="addWeakTask(${i})">+ Task</button></div>`).join('')||'<div class="muted small">No chapter is sufficiently sampled yet. Add question sessions with a chapter name.</div>'}</div></div><div class="section"><div class="card page-panel"><div class="section-head"><div><h2>Recent question logs</h2><p>Latest sessions recorded inside this dashboard.</p></div><span class="pill">${all.d} total questions</span></div>${S.qlog.slice(-10).reverse().map(q=>`<div class="schedule-item"><div class="date-box"><b>${q.done}</b><small>Q</small></div><div class="schedule-main"><b>${esc(q.sub)}${q.ch?' · '+esc(q.ch):''}</b><small>${q.ok}/${q.done} correct · ${q.d}</small></div><span class="table-status">${Math.round(q.ok/q.done*100)}%</span></div>`).join('')||'<div class="muted small">No logs yet.</div>'}</div></div>`}
function addWeakTask(i){const o=weakCh()[i];if(!o)return;S.todos.push({t:`Fix ${o.ch} (${o.a}% accuracy): 30 PYQs`,sub:o.sub,ch:o.ch,pri:'H',due:today(),min:60,x:false});save();toast('Weak-area task added')}

function subjectSyl(n){const L=CHA[n]||[];let done=0,max=0;L.forEach((c,i)=>{const r=cpr(n,i);done+=r[0];max+=r[1]});return{L,pr:max?Math.round(done/max*100):0,left:L.filter((_,i)=>!(sylBits(n,i)&1)).length,fin:S.fin?.[n]||new Date(new Date(S.exam+'T00:00:00').getTime()-30*864e5).toLocaleDateString('en-CA')}
}
function sylBits(n,i){return S.syl?.[`${n}|${CHA[n]?.[i]?.n}`]||0}
function qb(n,i,q){return S.sq?.[`${n}|${CHA[n]?.[i]?.n}#${q}`]||0}
function bitCount(v){return (v&1)+((v>>1)&1)+((v>>2)&1)}
function cpr(n,i){const c=CHA[n][i],b=sylBits(n,i);let d=(b&1)?1:0;for(let q=1;q<=c.t;q++)d+=bitCount(qb(n,i,q));return[d,1+3*c.t]}
function syToggle(n,i){const k=`${n}|${CHA[n][i].n}`,v=S.syl?.[k]||0;S.syl=S.syl||{};S.syl[k]=v^1;if(!(v&1))addXP(20,true);save();renderPage()}
function sqToggle(n,i,q,m){const k=`${n}|${CHA[n][i].n}#${q}`,v=S.sq?.[k]||0;S.sq=S.sq||{};S.sq[k]=v^m;if(!(v&m))addXP(m===4?5:10,true);save();renderPage()}
function setFinish(n,v){S.fin=S.fin||{};S.fin[n]=v;save();renderPage()}
function planSyl(n){const o=subjectSyl(n),need=Math.max(1,Math.ceil(o.left/Math.max(1,dd(o.fin)))),T=today();let a=0;o.L.forEach((c,i)=>{if(a<need&&!(sylBits(n,i)&1)){const text='Study chapter: '+c.n;if(!S.todos.some(t=>t.t===text&&t.due===T)){S.todos.push({t:text,sub:n,ch:c.n,pri:'H',due:T,min:90,x:false});a++}}});save();toast(a?'Added '+a+' chapter target(s)':'Already planned for today')}
function syllabusView(){const subs=['Physics','Chemistry','Mathematics'];const o=subjectSyl(sylSubject);return `<div class="section"><div class="subject-tabs">${subs.map(s=>`<button class="subject-tab ${sylSubject===s?'active':''}" onclick="sylSubject='${s}';renderPage()">${s}</button>`).join('')}</div></div><div class="section"><div class="syl-overview">${subs.map(s=>{const x=subjectSyl(s);return `<div class="card syl-card"><div class="kicker">${s}</div><div class="row"><div class="big-num" style="font-size:29px">${x.pr}%</div><span class="pill">${x.L.length-x.left}/${x.L.length} theory</span></div><div class="line-progress" style="margin-top:11px"><i style="width:${x.pr}%"></i></div><div class="muted tiny" style="margin-top:7px">${x.left} chapters still open</div></div>`}).join('')}</div></div><div class="section"><div class="card page-panel"><div class="section-head"><div><div class="kicker">${esc(sylSubject)}</div><h2>${o.left?o.left+' chapters to finish':'Theory complete'} · finish plan</h2><p>Track theory and the three QCT actions from the existing syllabus model.</p></div><div class="row"><label class="muted small">Theory by <input class="input" style="width:150px;display:inline-block" type="date" value="${o.fin}" onchange="setFinish('${esc(sylSubject)}',this.value)"></label>${o.left?`<button class="primary-btn" onclick="planSyl('${esc(sylSubject)}')">Add today’s target</button>`:''}</div></div><div class="hr"></div>${o.L.map((c,i)=>{const r=cpr(sylSubject,i),open=!!expandedChapters[sylSubject+i],b=sylBits(sylSubject,i);return `<div class="chapter-row"><details ${open?'open':''} ontoggle="expandedChapters['${esc(sylSubject+i)}']=this.open"><summary><div class="chapter-main"><span class="chapter-right">${i+1}</span><div style="min-width:0;flex:1"><div class="chapter-name">${esc(c.n)}</div><div class="chapter-meta">${c.t} QCTs${c.s?' · beyond core JEE Main set':''}</div></div><span class="pill">${r[0]}/${r[1]}</span></div></summary><div class="chapter-progress"><label class="check-pill"><input type="checkbox" ${b&1?'checked':''} onchange="syToggle('${esc(sylSubject)}',${i})"> Theory</label>${Array.from({length:c.t},(_,q)=>{const z=qb(sylSubject,i,q+1);return `<span class="pill" style="padding:6px 8px"><b style="font-size:9px">QCT ${q+1}</b> <label class="check-pill"><input type="checkbox" ${z&1?'checked':''} onchange="sqToggle('${esc(sylSubject)}',${i},${q+1},1)"> A</label> <label class="check-pill"><input type="checkbox" ${z&2?'checked':''} onchange="sqToggle('${esc(sylSubject)}',${i},${q+1},2)"> An</label> <label class="check-pill"><input type="checkbox" ${z&4?'checked':''} onchange="sqToggle('${esc(sylSubject)}',${i},${q+1},4)"> R</label></span>`}).join('')}</div></details></div>`}).join('')}</div></div>`}

function calendarView(){const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<first;i++)cells.push('<div></div>');for(let d=1;d<=dim;d++){const k=`${y}-${p2(m+1)}-${p2(d)}`,h=(S.days[k]?.s||0)/3600,r=Math.min(100,h/(S.goal||10)*100),isT=k===today(),isS=k===selectedDate,tests=S.tests.filter(t=>t.date===k);cells.push(`<button class="day-cell ${isT?'today':''} ${isS?'selected':''}" onclick="selectedDate='${k}';renderPage()"><span class="day-num">${d}</span><div class="day-hours">${h?h.toFixed(1)+'h':'No time'}</div><div class="day-meter"><i style="width:${r}%"></i></div>${tests.length?`<div class="day-tags">${tests.slice(0,2).map(t=>`<span class="tag">${esc(t.name)}</span>`).join('')}</div>`:''}</button>`)}const x=S.days[selectedDate]||{s:0,sub:{}},qq=S.qlog.filter(q=>q.d===selectedDate),dn=qq.reduce((a,q)=>a+q.done,0),ck=qq.reduce((a,q)=>a+q.ok,0),tasks=S.todos.filter(t=>t.due===selectedDate),ts=S.tests.filter(t=>t.date===selectedDate);return `<div class="section"><div class="card page-panel"><div class="calendar-head"><div><div class="kicker">Calendar</div><div class="month-title">${new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div></div><div class="row"><button class="icon-btn" onclick="calendarDate.setMonth(calendarDate.getMonth()-1);renderPage()">${icon('back')}</button><button class="ghost-btn" onclick="calendarDate=new Date();selectedDate=today();renderPage()">Today</button><button class="icon-btn" onclick="calendarDate.setMonth(calendarDate.getMonth()+1);renderPage()">${icon('chevron')}</button></div></div><div class="calendar-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells.join('')}</div></div></div><div class="section"><div class="card selected-day"><div class="row"><div><div class="kicker">Selected day</div><h2 style="margin:5px 0">${prettyDate(selectedDate)}</h2></div><span class="pill">${selectedDate===today()?'Today':''}</span></div><div class="grid grid-4" style="margin-top:16px"><div class="metric-box"><div class="kicker">Study</div><b>${hm(x.s||0)}</b><small>logged time</small></div><div class="metric-box"><div class="kicker">Questions</div><b>${dn}</b><small>${dn?Math.round(ck/dn*100)+'% accuracy':'none logged'}</small></div><div class="metric-box"><div class="kicker">Tasks</div><b>${tasks.filter(t=>t.x).length}/${tasks.length}</b><small>completed</small></div><div class="metric-box"><div class="kicker">Tests</div><b>${ts.length}</b><small>${ts.length?'scheduled':'none'}</small></div></div><div class="hr"></div>${Object.entries(x.sub||{}).length?`<div class="bar-list">${Object.entries(x.sub).map(([s,v])=>`<div class="bar-line"><span class="name">${esc(s)}</span><span class="track"><i style="width:${Math.min(100,v/(x.s||1)*100)}%"></i></span><b class="tiny">${(v/3600).toFixed(1)}h</b></div>`).join('')}</div>`:'<div class="muted small">No subject-level time logged for this day.</div>'}${S.notes[selectedDate]?`<div class="hr"></div><div class="muted small">${esc(S.notes[selectedDate])}</div>`:''}</div></div>`}

function analyticsView(){const scored=S.tests.filter(t=>tot(t)!==null&&t.mx);const q=qstat(),study=totalStudy(),best=streak(),subject=SUBS().map(s=>({s,h:dayTotals(s),q:qstat(s)}));return `<div class="section"><div class="analytics-cards">${metricCard('All-time study',study.toFixed(1)+'h',activeDays()+' active days','timer','Total recorded study time')}${metricCard('Question accuracy',q.a+'%',q.d+' questions','practice',q.d?q.c+' correct':'No logs yet')}${metricCard('Current level','Lv '+level(),Math.round(S.xp||0)+' XP','analytics',best+' day current streak')}</div></div><div class="section"><div class="analytics-grid"><div class="card chart-card"><div class="section-head"><div><h2>Study volume</h2><p>Last 8 weeks.</p></div><span class="pill">Target ${S.goal}h/day</span></div>${weeklyChart()}</div><div class="card page-panel"><div class="section-head"><div><h2>Time by subject</h2><p>All recorded study time.</p></div></div><div class="bar-list">${subject.sort((a,b)=>b.h-a.h).map(x=>`<div class="bar-line"><span class="name">${esc(x.s)}</span><span class="track"><i style="width:${study?x.h/study*100:0}%"></i></span><b class="tiny">${(x.h||0)/1?x.h/1/1:'0'}h</b></div>`).join('')}</div></div></div></div><div class="section"><div class="grid grid-2"><div class="card page-panel"><div class="section-head"><div><h2>Accuracy by subject</h2><p>Based on your logged question sessions.</p></div></div><div class="bar-list">${SUBS().map(s=>{const a=qstat(s);return `<div class="bar-line"><span class="name">${esc(s)}</span><span class="track"><i style="width:${a.a}%"></i></span><b class="tiny">${a.a}%</b></div>`}).join('')}</div></div><div class="card page-panel"><div class="section-head"><div><h2>Tests vs target</h2><p>Target score: ${S.target}%.</p></div></div>${scored.length?`<div class="chart">${scored.slice(-12).map((t,i)=>`<div class="chart-col" title="${esc(t.name)} · ${pc(t)}%"><div class="chart-bar" style="height:${Math.max(7,pc(t))}%;background:${pc(t)>=S.target?'var(--success)':'var(--accent)'};opacity:${i===scored.length-1?1:.52}"></div></div>`).join('')}</div><div class="chart-labels">${scored.slice(-12).map(t=>`<span>${esc(t.name.replace(/Quizrr /,'').slice(0,8))}</span>`).join('')}</div>`:'<div class="muted small" style="padding:55px 0;text-align:center">Enter your first mock result to unlock the score trend.</div>'}</div></div></div><div class="section"><div class="card page-panel"><div class="section-head"><div><h2>Weakest chapters</h2><p>Data-backed only where enough attempts exist.</p></div></div>${weakCh().slice(0,8).map(w=>`<div class="weak-row"><span><b>${esc(w.ch)}</b><small class="muted" style="display:block">${esc(w.sub)} · ${w.d} questions</small></span><b class="${w.a<60?'danger':'warning'}">${w.a}%</b></div>`).join('')||'<div class="muted small">Your chapter-level accuracy will appear here after 10+ logged attempts per chapter.</div>'}</div></div>`}

function settingsView(){return `<div class="section"><div class="settings-grid"><div class="card page-panel settings-profile-card"><div class="section-head"><div><h2>Profile</h2><p>Used for greetings and dashboard context.</p></div><div class="avatar" style="width:52px;height:52px">${esc(initials(S.name))}</div></div><div class="stack"><input class="input" id="pname" value="${esc(S.name)}" placeholder="Full name"><select class="select" id="pstream"><option ${S.stream==='Engineering'?'selected':''}>Engineering</option><option ${S.stream==='Medical'?'selected':''}>Medical</option></select><select class="select" id="pclass"><option ${S.className==='Class 11'?'selected':''}>Class 11</option><option ${S.className==='Class 12'?'selected':''}>Class 12</option><option ${S.className==='1st Time Dropper'?'selected':''}>1st Time Dropper</option><option ${S.className==='2nd Time Dropper'?'selected':''}>2nd Time Dropper</option></select><select class="select" id="pyear"><option>2027</option><option>2028</option><option>2029</option></select><button class="primary-btn" onclick="saveProfile()">Save profile</button></div></div><div class="card page-panel"><div class="section-head"><div><h2>Study system</h2><p>Control the targets that drive your dashboard.</p></div></div>${settingRow('Exam date',`<input class="input" style="width:160px" type="date" value="${S.exam}" onchange="S.exam=this.value;save();shell()">`,'The date used for the D-day counter.')}${settingRow('Daily goal',`<input class="input" style="width:92px" type="number" min="1" max="18" value="${S.goal}" onchange="S.goal=Number(this.value)||10;save();shell()">`,'Hours of focused study per day.')}${settingRow('Target score',`<input class="input" style="width:92px" type="number" min="1" max="100" value="${S.target}" onchange="S.target=Number(this.value)||80;save();shell()">`,'Used to highlight test results.')}${settingRow('Theme',`<div class="color-dots"><button class="color-dot ${S.theme==='dark'?'active':''}" style="background:#0b0d10" onclick="S.theme='dark';save();applyTheme();shell()"></button><button class="color-dot ${S.theme==='light'?'active':''}" style="background:#f5f7fb" onclick="S.theme='light';save();applyTheme();shell()"></button></div>`,'Dark is recommended for long sessions.')}${settingRow('Accent',`${['#7c87ff','#4f8cff','#40c9a2','#f59e0b','#ef5da8'].map(c=>`<button class="color-dot ${S.acc===c?'active':''}" style="background:${c}" onclick="S.acc='${c}';save();applyTheme();shell()"></button>`).join('')}`,'Choose the dashboard highlight color.')}</div></div></div><div class="section"><div class="grid grid-2"><div class="card page-panel"><div class="section-head"><div><h2>Data backup</h2><p>Your progress is stored in this browser.</p></div></div><div class="row wrap"><button class="primary-btn" onclick="exportData()">${icon('download')}Export backup</button><label class="ghost-btn" style="cursor:pointer">Import backup<input hidden type="file" accept="application/json" onchange="importData(this.files[0])"></label></div><p class="muted small">Export before clearing browser data or moving to another device. Import uses the same local structure as this app.</p></div><div class="card page-panel"><div class="section-head"><div><h2>Danger zone</h2><p>Use only when you intend to start from zero.</p></div></div><button class="ghost-btn" onclick="resetAll()">Reset everything</button></div></div></div>`}
function settingRow(label,control,desc){return `<div class="setting-row"><div><label>${label}</label><p>${desc}</p></div><div>${control}</div></div>`}
function saveProfile(){S.name=$('pname').value.trim()||'Shriharsh';S.stream=$('pstream').value;S.className=$('pclass').value;S.targetYear=$('pyear').value;S.onboarded=true;save();shell();toast('Profile saved')}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='jee-27-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);S=Object.assign({},DEFAULT,p);normalize();shell();toast('Backup imported')}catch(e){toast('Invalid backup file')}};r.readAsText(file)}
function resetAll(){if(!confirm('Reset all JEE 27 data? This cannot be undone.'))return;localStorage.removeItem(KEY);location.reload()}
function quickAdd(){const choice=prompt('Quick add: type task, test, or note','task');if(!choice)return;const c=choice.toLowerCase();if(c.startsWith('task')){S.ui.tab='tasks';save();shell();setTimeout(()=>document.querySelector('#task_text')?.focus(),70)}else if(c.startsWith('test')){S.ui.tab='tests';save();shell();setTimeout(()=>document.querySelector('#tn')?.focus(),70)}else{const note=prompt('Note for today','');if(note){S.notes[today()]=note;save();toast('Note saved')}}}

function landing(){
  $('app').innerHTML=`<div class="onboarding"><div class="onboard-shell"><section class="onboard-left"><div class="onboard-logo"><div class="brand-mark" style="width:36px;height:36px">${icon('analytics')}</div>JEE 27 · Command Center</div><h1>Make the next 111 days count.</h1><p>A professional study workspace inspired by the calm, information-dense dashboards you use for tests, daily goals and practice — but tailored into one place for your JEE 2027 preparation.</p><div class="feature-list"><div class="feature"><span>${icon('timer')}</span>Focused study timer with subject-level time</div><div class="feature"><span>${icon('test')}</span>Quizrr QPT / QFT schedule with results & workflow</div><div class="feature"><span>${icon('practice')}</span>MARKS practice logging and weak-chapter tracking</div><div class="feature"><span>${icon('calendar')}</span>Calendar, heatmap and progress analytics</div></div></section><section class="onboard-right"><div class="step-dots"><i class="active"></i><i></i></div><h2>Set up your command center</h2><div class="sub">This takes about 30 seconds. Everything stays in this browser unless you export it.</div><div class="setup-form"><label class="setup-label">Your name</label><input class="input setup-input" id="ob_name" value="${esc(S.name||'Shriharsh')}" placeholder="e.g. Shriharsh"><label class="setup-label">Preparation stream</label><div class="choice-grid" id="streamChoices">${['Engineering','Medical'].map(v=>`<button class="choice ${S.stream===v?'active':''}" onclick="obStream('${v}')">${v}</button>`).join('')}</div><label class="setup-label">Class</label><div class="choice-grid" id="classChoices">${['Class 11','Class 12','1st Time Dropper'].map(v=>`<button class="choice ${S.className===v?'active':''}" onclick="obClass('${v}')">${v}</button>`).join('')}</div><label class="setup-label">Daily study target</label><select class="select setup-input" id="ob_goal">${[6,7,8,9,10,11,12].map(v=>`<option ${Number(S.goal)===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="onboard-footer"><small>JEE Main ${esc(S.targetYear||'2027')} · exam date ${esc(S.exam)}</small><button class="primary-btn" onclick="finishOnboarding()">Enter dashboard ${icon('arrow')}</button></div></section></div></div>`;
}
let obStreamValue=S.stream,obClassValue=S.className;
function obStream(v){obStreamValue=v;document.querySelectorAll('#streamChoices .choice').forEach(b=>b.classList.toggle('active',b.textContent===v))}
function obClass(v){obClassValue=v;document.querySelectorAll('#classChoices .choice').forEach(b=>b.classList.toggle('active',b.textContent===v))}
function finishOnboarding(){S.name=$('ob_name').value.trim()||'Shriharsh';S.stream=obStreamValue;S.className=obClassValue;S.goal=Number($('ob_goal').value)||10;S.onboarded=true;save();applyTheme();shell();toast('Welcome to JEE 27')}

normalize();
if(!S.onboarded){landing()}else{if(S.ui.tab==='home')S.ui.tab='home';shell()}
</script>
</body>
