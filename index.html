<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>JEE 2027 · Study Tracker</title>
<meta name="description" content="Minimal JEE study tracker: study clock, syllabus tracker, mock test analysis, practice log and daily stats.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a12;--g:rgba(255,255,255,.045);--g2:rgba(255,255,255,.085);--bd:rgba(255,255,255,.09);--tx:#eef2f8;--mut:#8b95a7;--ac:#5b9dff;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--b1:rgba(91,157,255,.20);--b2:rgba(52,211,153,.10);color-scheme:dark}
:root[data-theme=light]{--bg:#eef1f6;--g:rgba(255,255,255,.55);--g2:rgba(255,255,255,.85);--bd:rgba(15,23,42,.09);--tx:#0f172a;--mut:#5b6474;--ac:#2563eb;--ok:#059669;--bad:#dc2626;--warn:#d97706;--b1:rgba(37,99,235,.16);--b2:rgba(5,150,105,.10);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(640px 420px at 8% -8%,var(--b1),transparent 70%),radial-gradient(520px 420px at 100% 35%,var(--b2),transparent 70%)}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}h3{font-size:17px}
header.top{position:sticky;top:0;z-index:5;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 55%,transparent);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
.hw{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 14px var(--ac)}
.tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--g2);border:1px solid var(--bd);color:var(--mut);white-space:nowrap;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs button{background:none;border:0;color:var(--mut);font:inherit;font-weight:500;padding:7px 11px;border-radius:10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--tx)}.tabs button.on{color:var(--tx);background:var(--g2)}
.icon-btn{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{color:var(--tx)}
.tabbar{display:none}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--g);border:1px solid var(--bd);border-radius:16px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.stack{display:flex;flex-direction:column;gap:14px}
.two{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:880px){.two{grid-template-columns:1.35fr 1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:500}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.acc{color:var(--ac)}
.stat b{display:block;font-size:24px;font-weight:600;margin-top:2px}.stat small{color:var(--mut);font-size:12px}
.btn{background:var(--g2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 13px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:color-mix(in srgb,var(--ac) 50%,var(--bd))}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;padding:4px;display:inline-flex;align-items:center;gap:4px}.x:hover{color:var(--tx)}
input,select,textarea{background:var(--g);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font:inherit;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
select option{background:var(--bg)}
input[type=number]{width:84px}
.f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--g);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.chip small{display:block;color:var(--mut);font-size:11.5px}
.chip.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.seg{display:inline-flex;background:var(--g);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--mut);font:inherit;font-size:12.5px;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--g2);color:var(--tx)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.bar{height:6px;background:var(--g2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}
.stk{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--g2)}.stk i{display:block;height:100%}
.big{font-size:clamp(52px,13vw,96px);font-weight:700;line-height:1;letter-spacing:-.03em;margin:22px 0 6px}
.play{width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 8px 30px color-mix(in srgb,var(--ac) 40%,transparent)}
.play.on{background:var(--g2);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.it:last-child{border-bottom:0}.it>span{flex:1;min-width:0}
.done>span{text-decoration:line-through;color:var(--mut)}
.tblw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:500;font-size:12px}tr:last-child td{border-bottom:0}
.rt input{width:66px}
.pills{display:flex;gap:5px}
.pill{width:30px;height:30px;border-radius:9px;border:1px solid var(--bd);background:var(--g);color:var(--mut);font:600 11px Inter,sans-serif;cursor:pointer;display:grid;place-items:center}
.pill.on{background:color-mix(in srgb,var(--ok) 22%,transparent);border-color:var(--ok);color:var(--ok)}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--c,var(--ac)) calc(var(--p)*1%),var(--g2) 0);display:grid;place-items:center;flex:none}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:600;font-size:15px}
.donut{width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center}.donut span{width:80px;height:80px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.2}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--g2);display:block}
.ins{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--g);border:1px solid var(--bd)}
.ins b{width:4px;border-radius:4px;flex:none}
dialog{border:1px solid var(--bd);border-radius:20px;padding:20px;width:min(780px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.empty{color:var(--mut);padding:18px 0;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--g2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);color:var(--tx);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap;font-weight:500}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.it>.sn{flex:none;width:22px;font-size:12px}
.rp{width:38px;text-align:right;font-size:12px;flex:none}
.qr{display:flex;gap:4px;align-items:center;margin-top:6px;flex-wrap:wrap}
.qb{width:22px;height:22px;border-radius:6px;border:1px solid var(--bd);background:var(--g);color:var(--mut);font:600 10.5px 'JetBrains Mono',monospace;cursor:pointer;padding:0;display:grid;place-items:center}
.qb.on{background:color-mix(in srgb,var(--ac) 22%,transparent);border-color:var(--ac);color:var(--ac)}
.ql{font-size:10.5px;letter-spacing:.08em;color:var(--ac);text-decoration:none;font-weight:600;margin-right:2px}.ql:hover{text-decoration:underline}
.qc{font-size:11px;margin-left:4px}
.adv{font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--bd);color:var(--warn);margin-left:6px;vertical-align:middle;font-weight:500}
.tl{color:var(--tx);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px}.tl:hover{color:var(--ac)}
.tsy{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.tsy small{display:flex;gap:6px;align-items:baseline;color:var(--mut);font-size:12px;white-space:normal}
.tsy .dot{width:6px;height:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cw{font-size:11px;color:var(--mut);text-align:center;padding-bottom:2px}
.cd{min-height:58px;border-radius:10px;border:1px solid var(--bd);background:var(--g);color:var(--tx);font:inherit;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:6px 7px;position:relative;min-width:0}
.cd small{font-size:10.5px;color:var(--mut)}
.cd.now{border-color:var(--ac)}.cd.sel{outline:2px solid var(--ac);outline-offset:1px}.cd.fut{opacity:.5}
.tdot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cdet{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--g);border:1px solid var(--bd);display:flex;flex-direction:column;gap:6px;font-size:13px}
@media(max-width:760px){
 .cal{gap:4px}.cd{min-height:46px;padding:4px 5px;font-size:12px;border-radius:8px}.cd small{font-size:9px}.tdot{top:5px;right:5px}
 .qb{width:24px;height:24px}
 .tabs{display:none}
 .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
 .tabbar button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;cursor:pointer}
 .tabbar button.on{color:var(--ac)}
 main{padding-bottom:110px}
 #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .hide-sm{display:none}
 .sylc{flex-direction:column;align-items:flex-start!important;gap:10px}
 .sylc .ring{width:56px;height:56px}.sylc .ring span{width:44px;height:44px;font-size:12px}
 .pills{gap:3px}.pill{width:26px;height:26px;font-size:10px;border-radius:7px}
 .rp{display:none}
 .it>span{overflow-wrap:anywhere;font-size:13.5px}
}
.tabs{overflow-x:auto;scrollbar-width:none;max-width:calc(100vw - 250px)}.tabs button{white-space:nowrap}
.tabbar{overflow-x:auto;scrollbar-width:none}.tabbar button{flex:0 0 auto;min-width:64px}
.brand{cursor:pointer}.brand img{border-radius:6px}
.cdn{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}.cdn div{background:var(--g2);border:1px solid var(--bd);border-radius:14px;padding:12px 4px}.cdn b{font-size:clamp(24px,7vw,40px);display:block;line-height:1.1}
:root[data-theme=amoled]{--bg:#000;--g:rgba(255,255,255,.06);--g2:rgba(255,255,255,.12);--bd:rgba(255,255,255,.16);--tx:#fff;--mut:#a3adbf;--b1:transparent;--b2:transparent}
:root[data-theme=slate]{--bg:#03070d;--g:rgba(110,175,255,.04);--g2:rgba(110,175,255,.085);--bd:rgba(140,195,255,.2);--tx:#f3f8ff;--mut:#a3b5ce;--ac:#4cc6ff;--ok:#4ade80;--warn:#fcd34d;--b1:rgba(76,198,255,.2);--b2:rgba(129,140,248,.14)}
:root[data-theme=forest]{--bg:#010805;--g:rgba(90,230,170,.04);--g2:rgba(90,230,170,.09);--bd:rgba(110,235,185,.2);--tx:#f0fff7;--mut:#9cc7b2;--ac:#3deb9c;--ok:#a3e635;--warn:#fcd34d;--b1:rgba(61,235,156,.18);--b2:rgba(250,204,21,.09)}
:root[data-theme=rose]{--bg:#090206;--g:rgba(255,130,175,.04);--g2:rgba(255,130,175,.09);--bd:rgba(255,150,190,.22);--tx:#fff2f7;--mut:#d1a4b6;--ac:#ff7ba6;--ok:#6ee7b7;--warn:#fdba74;--b1:rgba(255,123,166,.2);--b2:rgba(192,132,252,.15)}
.card,.chip,.btn,.tag,.seg{backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}
.grip{cursor:grab;color:var(--mut);padding:0 4px;user-select:none;flex:none}.it.dragover{outline:2px dashed var(--ac);outline-offset:-2px;border-radius:10px}
.mini{padding:4px 8px;min-width:0}.steps{display:flex;flex-wrap:wrap;gap:6px 14px;width:100%;margin:2px 0 4px 34px}

.slb{display:flex;gap:6px;align-items:flex-end;height:110px}.slb div{flex:1;border-radius:6px;background:var(--ac);min-height:4px}
/* ---- single area button ---- */
.areabtn{display:inline-flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--bd);background:var(--g);cursor:pointer;font:inherit;color:var(--mut)}
.areabtn span{padding:5px 11px;border-radius:999px;font-weight:600;font-size:12.5px;transition:.2s}
.areabtn span.on{background:var(--ac);color:#03101c;animation:glow 1.8s ease-in-out infinite}
.areabtn:hover span:not(.on){color:var(--tx)}
.areabtn.flash span{animation:blink .6s ease}.areabtn.flash span.on{animation:blink .6s ease,glow 1.8s ease-in-out .6s infinite}
@keyframes blink{0%,100%{opacity:1}25%{opacity:.15}55%{opacity:1}75%{opacity:.35}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 14px 1px color-mix(in srgb,var(--ac) 65%,transparent)}}
@media(prefers-reduced-motion:reduce){.areabtn span,.areabtn.flash span{animation:none!important}}
/* ---- very dark, very transparent themes ---- */
:root[data-theme=slate]{--bg:#02050a;--g:rgba(110,175,255,.02);--g2:rgba(110,175,255,.05);--bd:rgba(140,195,255,.14);--b1:rgba(76,198,255,.10);--b2:rgba(129,140,248,.06)}
:root[data-theme=forest]{--bg:#000503;--g:rgba(90,230,170,.02);--g2:rgba(90,230,170,.05);--bd:rgba(110,235,185,.14);--b1:rgba(61,235,156,.09);--b2:rgba(250,204,21,.05)}
:root[data-theme=rose]{--bg:#050104;--g:rgba(255,130,175,.02);--g2:rgba(255,130,175,.05);--bd:rgba(255,150,190,.15);--b1:rgba(255,123,166,.10);--b2:rgba(192,132,252,.06)}
.card{backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3)}
/* ---- appearance (corner style / density) ---- */
:root[data-rad=sharp] .card{border-radius:6px}:root[data-rad=sharp] .btn,:root[data-rad=sharp] .chip,:root[data-rad=sharp] .tag,:root[data-rad=sharp] input,:root[data-rad=sharp] select,:root[data-rad=sharp] textarea,:root[data-rad=sharp] .seg,:root[data-rad=sharp] .seg button,:root[data-rad=sharp] .areabtn,:root[data-rad=sharp] .areabtn span{border-radius:4px}
:root[data-rad=pill] .btn,:root[data-rad=pill] .chip,:root[data-rad=pill] .tag,:root[data-rad=pill] .seg,:root[data-rad=pill] .seg button{border-radius:999px}:root[data-rad=pill] .card{border-radius:26px}
:root[data-den=compact] .card{padding:10px 12px}:root[data-den=relaxed] .card{padding:24px}
/* ---- left collapsible sidebar (desktop) ---- */
.side{display:none}
@media(min-width:1100px){
:root{--sw:72px}:root[data-side=open]{--sw:224px}
body{padding-left:var(--sw);transition:padding .25s}
.top .brand,.top .tabs,.top #setb{display:none}
.side{display:flex;flex-direction:column;gap:6px;position:fixed;left:0;top:0;bottom:0;width:var(--sw);padding:16px 12px 18px;border-right:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);z-index:7;overflow:hidden;transition:width .28s cubic-bezier(.4,0,.2,1),box-shadow .28s}
:root:not([data-side=compact]) .side:hover{width:224px;box-shadow:12px 0 40px -18px rgba(0,0,0,.8)}
.side .lb{opacity:0;max-width:0;overflow:hidden;white-space:nowrap;transition:opacity .2s,max-width .28s}
:root[data-side=open] .side .lb,:root:not([data-side=compact]) .side:hover .lb{opacity:1;max-width:170px}
.sb-brand{display:flex;align-items:center;gap:12px;padding:4px 6px;margin-bottom:16px;cursor:pointer;font-weight:700;font-size:15px;white-space:nowrap}
.sb-brand img{width:36px;height:36px;border-radius:11px;flex:none;transition:transform .4s}.sb-brand:hover img{transform:rotate(-8deg) scale(1.08)}
.side button.nv{display:flex;align-items:center;gap:14px;background:none;border:0;color:var(--mut);font:inherit;font-weight:500;padding:11px 15px;border-radius:12px;cursor:pointer;text-align:left;white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.side button.nv svg{flex:none}.side button.nv:hover{color:var(--tx);background:var(--g);transform:translateX(3px)}
.side button.nv.on{color:var(--tx);background:var(--g2);box-shadow:inset 3px 0 0 var(--ac)}
.setc{margin:auto 0 0 6px;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--bd);background:var(--g);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:transform .45s,background .2s}
.setc:hover{transform:rotate(90deg);background:var(--g2)}}
/* ---- date fields ---- */
.dp{display:inline-flex;align-items:center;gap:2px;position:relative}.dp input[type=text]{width:92px}
.dpb{background:none;border:0;color:var(--mut);cursor:pointer;padding:5px;display:grid;place-items:center;border-radius:8px;transition:color .2s,background .2s}.dpb:hover{color:var(--tx);background:var(--g2)}
.dp input[type=date]{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:0;bottom:0}
/* ---- board syllabus: two roomy rows ---- */
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}.bgrid .card{padding:20px 22px;min-height:104px}
@media(max-width:700px){.bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hero2{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 13%,var(--g)),var(--g))}.hg{font-size:clamp(20px,4vw,28px);font-weight:700;letter-spacing:-.02em}
.pill{display:inline-block;padding:6px 13px;border-radius:999px;font-weight:700;font-size:12.5px}.pill.bad{background:rgba(251,113,133,.16);color:#fb7185}.pill.ok{background:rgba(74,222,128,.15);color:#4ade80}

 return `<section class="card" style="margin-bottom:14px;border-color:var(--warn)"><div class="row"><div><b>Back up your data</b><div class="mut" style="font-size:12.5px">${age===null?'You have never exported a backup.':'Your last backup was '+age+' days ago.'} Everything is stored only in this browser — clearing it would erase your progress.</div></div><button class="btn pri" onclick="exportData();go()">Export backup</button></div></section>`}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
/* ---------- overall: JEE vs Board ---------- */
function ovStats(D,area){const ks=Object.keys(D).filter(k=>D[k].s>0).sort(),sec=k=>D[k]?.s||0;let w=0,m=0,all=0,best=0,act=0;
 for(const k of ks){all+=D[k].s;act++;best=Math.max(best,D[k].s)}for(let o=0;o<7;o++)w+=sec(dstr(o));for(let o=0;o<30;o++)m+=sec(dstr(o));
 let st=0,o=sec(td())>=60?0:1;for(;;o++){if(sec(dstr(o))>=60)st++;else break}
 const ss=S.sess.filter(x=>(x.a||'jee')===area),lg=ss.reduce((a,x)=>Math.max(a,x.sec),0),by={};ks.forEach(k=>Object.entries(D[k].sub||{}).forEach(([n,v])=>{const g=area==='board'?n:(n.includes(' · ')?n.split(' · ')[0]:TSUB.includes(n)?'Test':S.subs.includes(n)?'Study':n);by[g]=(by[g]||0)+v}));
 return{today:sec(td()),w,m,all,act,st,avg:act?all/act:0,best,n:ss.length,lg,by}}
function vOverall(){const J=ovStats(S.days,'jee'),B=ovStats(S.bdays||{},'board'),tot=J.today+B.today,H=x=>(x/3600).toFixed(1)+'h',pj=J.all+B.all?Math.round(J.all/(J.all+B.all)*100):50;
 const rows=[['Today',J.today,B.today,H],['Last 7 days',J.w,B.w,H],['Last 30 days',J.m,B.m,H],['All time',J.all,B.all,H],['Active days',J.act,B.act,x=>x],['Current streak',J.st,B.st,x=>x+' d'],['Avg / active day',J.avg,B.avg,H],['Best day',J.best,B.best,H],['Sessions',J.n,B.n,x=>x],['Longest session',J.lg,B.lg,x=>hm(x)]];
 const days=[];for(let o=13;o>=0;o--){const d=dstr(o);days.push([(S.days[d]?.s||0)/3600,((S.bdays||{})[d]?.s||0)/3600,d])}const mx=Math.max(1,...days.map(x=>x[0]+x[1]));
 const by=(o,c)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="it"><span class="dot" style="background:${col(k)}"></span><span>${esc(k)}</span><span class="mono mut" style="flex:none">${H(v)}</span></div>`).join('')||'<div class="empty">No time logged yet.</div>';
 return `<h3 style="margin-bottom:14px">Overall · JEE vs Board</h3>
<section class="card" style="margin-bottom:14px"><div class="lbl">Total study time today (JEE + Board)</div><div class="big mono" style="margin:10px 0 4px">${hms(tot)}</div>
<div class="mut mono" style="font-size:13px"><span style="color:var(--ac)">JEE ${hms(J.today)}</span> · <span style="color:var(--warn)">Board ${hms(B.today)}</span></div>
<div class="f" style="margin-top:14px"><button class="btn pri" onclick="setArea('jee')">Open JEE timer</button><button class="btn" onclick="setArea('board')">Open Board timer</button></div></section>
<div class="g2" style="margin-bottom:14px"><div class="card stat"><div class="lbl">Total all time</div><b class="mono">${H(J.all+B.all)}</b></div><div class="card stat"><div class="lbl">Last 7 days</div><b class="mono">${H(J.w+B.w)}</b></div><div class="card stat"><div class="lbl">Time split</div><b class="mono" style="font-size:20px">${pj}% / ${100-pj}%</b><small>JEE / Board</small></div><div class="card stat"><div class="lbl">Active days</div><b class="mono">${new Set([...Object.keys(S.days).filter(k=>S.days[k].s>0),...Object.keys(S.bdays||{}).filter(k=>S.bdays[k].s>0)]).size}</b></div></div>
<section class="card" style="margin-bottom:14px"><div class="lbl" style="margin-bottom:10px">Share of study time</div><div style="display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--g2)"><div style="width:${pj}%;background:var(--ac)"></div><div style="width:${100-pj}%;background:var(--warn)"></div></div></section>
<section class="card" style="margin-bottom:14px"><div class="row" style="margin-bottom:10px"><div class="lbl">Side by side</div><div class="f" style="gap:14px;font-size:12px;margin:0"><span class="f" style="gap:5px"><span class="dot" style="background:var(--ac)"></span>JEE</span><span class="f" style="gap:5px"><span class="dot" style="background:var(--warn)"></span>Board</span></div></div>
<div class="tblw"><table style="width:100%;border-collapse:collapse"><tr class="mut" style="text-align:left"><th></th><th style="padding:6px 8px;text-align:right">JEE</th><th style="padding:6px 8px;text-align:right">Board</th></tr>${rows.map(([l,a,b,f])=>`<tr style="border-top:1px solid var(--bd)"><td style="padding:9px 8px">${l}</td><td class="mono" style="padding:9px 8px;text-align:right;${a>b?'color:var(--ac);font-weight:600':''}">${f(a)}</td><td class="mono" style="padding:9px 8px;text-align:right;${b>a?'color:var(--warn);font-weight:600':''}">${f(b)}</td></tr>`).join('')}</table></div></section>
<section class="card" style="margin-bottom:14px"><div class="lbl" style="margin-bottom:10px">Last 14 days · stacked hours</div><div class="slb">${days.map(([a,b,d])=>`<div title="${d}: JEE ${a.toFixed(1)}h · Board ${b.toFixed(1)}h" style="height:${Math.max(4,(a+b)/mx*100)}%;background:linear-gradient(to top,var(--ac) ${a/(a+b||1)*100}%,var(--warn) 0);opacity:${a+b?1:.15}"></div>`).join('')}</div></section>

/* ---------- sleep ---------- */
const slm=(b,w)=>{const[a,c]=b.split(':').map(Number),[e,f]=w.split(':').map(Number);let m=e*60+f-(a*60+c);if(m<=0)m+=1440;return m};
const sfm=m=>`${Math.floor(m/60)}h ${p2(m%60)}m`;
function sleepAvg(){const a=[];for(let o=0;o<7;o++){const x=(S.sleep||{})[dstr(o)];if(x)a.push(slm(x.bed,x.wake))}return a.length?a.reduce((x,y)=>x+y,0)/a.length/60:0}
function saveSleep(){const d=$('sd').value,b=$('sb').value,w=$('sw').value;if(!d||!b||!w){toast('Enter date, bedtime and wake time');return}S.sleep=S.sleep||{};S.sleep[d]={bed:b,wake:w};save();go()}
function vSleep(){S.sleep=S.sleep||{};const g=(S.sleepGoal||8)*60,rows=[];for(let o=0;o<14;o++){const d=dstr(o),x=S.sleep[d];rows.push({d,x,m:x?slm(x.bed,x.wake):0})}
const w7=rows.slice(0,7).filter(r=>r.x),av=w7.length?w7.reduce((a,r)=>a+r.m,0)/w7.length:0,debt=Math.max(0,g*7-rows.slice(0,7).reduce((a,r)=>a+r.m,0));let st=0;for(const r of rows){if(r.x&&r.m>=g)st++;else if(r.x||st)break}
const mx=Math.max(g,...rows.map(r=>r.m));
return `<div class="g2" style="margin-bottom:14px"><div class="card stat"><div class="lbl">Last night</div><b class="mono" style="font-size:22px">${rows[0].x?sfm(rows[0].m):'—'}</b></div><div class="card stat"><div class="lbl">7-day avg</div><b class="mono" style="font-size:22px">${av?sfm(Math.round(av)):'—'}</b><small>goal ${S.sleepGoal||8}h</small></div><div class="card stat"><div class="lbl">Sleep debt (7d)</div><b class="mono" style="font-size:22px">${sfm(Math.round(debt))}</b></div><div class="card stat"><div class="lbl">Goal streak</div><b class="mono">${st}<small> nights</small></b></div></div>
<section class="card" style="margin-bottom:14px"><div class="lbl" style="margin-bottom:10px">Log sleep</div><div class="f"><label class="fl">Woke up on<input type="date" id="sd" value="${td()}"></label><label class="fl">Bedtime<input type="time" id="sb" value="23:00"></label><label class="fl">Wake time<input type="time" id="sw" value="06:00"></label><button class="btn pri" onclick="saveSleep()" style="align-self:flex-end">${ic('plus',15)}Save</button></div></section>
<section class="card" style="margin-bottom:14px"><div class="lbl" style="margin-bottom:10px">Last 14 nights</div><div class="slb">${[...rows].reverse().map(r=>`<div title="${r.d}: ${r.x?sfm(r.m):'no entry'}" style="height:${Math.max(4,r.m/mx*100)}%;opacity:${r.x?1:.15};background:${r.m>=g?'var(--ok)':'var(--ac)'}"></div>`).join('')}</div></section>
<section class="card"><div class="lbl" style="margin-bottom:6px">History</div>${rows.filter(r=>r.x).map(r=>`<div class="it"><span>${fdate(r.d)}<br><small class="mut">${r.x.bed} → ${r.x.wake}</small></span><span class="mono ${r.m>=g?'ok':''}" style="flex:none">${sfm(r.m)}</span><button class="x" onclick="delete S.sleep['${r.d}'];save();go()" aria-label="Delete">${ic('x',15)}</button></div>`).join('')||'<div class="empty">No sleep logged yet.</div>'}</section>`}
/* ---------- weekly insight ---------- */
function insight(){const w=i=>{let t=0;for(let o=i*7;o<i*7+7;o++)t+=(DAYS()[dstr(o)]?.s||0);return t/3600},a=w(0),b=w(1),wk=weak(),pend=(S.back||[]).filter(x=>!x.x).length,all=Object.keys(CHD),sy=Math.round(all.reduce((x,s)=>x+sylPct(s),0)/all.length),sl=sleepAvg(),L=[];
L.push(`${a.toFixed(1)}h studied this week${b?` (${a>=b?'+':''}${(a-b).toFixed(1)}h vs last week)`:''}`);if(wk)L.push(`Weakest subject: ${wk} — add extra QCTs and PYQs there`);L.push(`Syllabus ${sy}% complete`);
const sc=S.tests.map(tot).filter(v=>v!==null);if(sc.length){const bst=Math.max(...sc);L.push(`Best test score ${bst}/300${S.goalMain?` · target ${S.goalMain} (${Math.round(bst/S.goalMain*100)}%)`:''}`)}
if(pend)L.push(`${pend} backlog task${pend>1?'s':''} pending — clear them to grow your streak`);if(sl)L.push(`Sleep averaging ${sl.toFixed(1)}h this week`);

/* ---------- boot ---------- */
if(S.theme)document.documentElement.dataset.theme=S.theme;else if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.dataset.theme='light';
const dmy=iso=>{if(!iso)return'';const[a,b,c]=String(iso).split('-');return `${c}/${b}/${(a||'').slice(2)}`};
function pdmy(v){const m=String(v).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/);if(!m)return null;let d=+m[1],mo=+m[2],y=m[3].length==2?2000+ +m[3]:+m[3];const dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;return `${y}-${p2(mo)}-${p2(d)}`}
function enhanceDates(){document.querySelectorAll('input[type=date]:not([data-dp])').forEach(o=>{o.dataset.dp=1;const w=document.createElement('span');w.className='dp',t=document.createElement('input'),b=document.createElement('button');
 t.type='text';t.className=o.className;t.placeholder='dd/mm/yy';t.inputMode='numeric';t.value=dmy(o.value);t.setAttribute('aria-label','Date (dd/mm/yy)');t.style.cssText=o.getAttribute('style')||'';
 b.type='button';b.className='dpb';b.setAttribute('aria-label','Pick a date');b.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
 o.parentNode.insertBefore(w,o);w.append(t,b,o);
 t.addEventListener('change',()=>{const v=t.value.trim(),iso=v?pdmy(v):'';if(v&&!iso){toast('Use the format dd/mm/yy');t.value=dmy(o.value);return}o.value=iso||'';o.dispatchEvent(new Event('change',{bubbles:true}))});
